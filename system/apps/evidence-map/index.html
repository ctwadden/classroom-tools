<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0} *{box-sizing:border-box} img{max-width:100%}
  [hidden]{display:none!important} :root{color-scheme:light dark}
</style>
<title>Evidence Map</title>
<meta name="description" content="A semester-long, fillable outcome report card for a student — like a swimming-lesson badge sheet for curriculum outcomes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
  :root{
    --ground:#eaeef6; --surface:#ffffff; --surface-2:#f5f8fd; --surface-3:#eef2fa;
    --ink:#14203a; --ink-soft:#43506d; --muted:#77839f; --faint:#9aa5bd;
    --line:#e0e6f1; --line-strong:#cfd7e6;
    --navy:#0f1b33; --navy-ink:#eaeff8; --navy-soft:#9aa7c6; --navy-line:#26324f; --navy-active:#1d2c4d;
    --accent:#2563eb; --accent-soft:#e6edfd; --accent-ink:#ffffff;
    --brand:#12b3a4; --brand-ink:#ffffff;
    /* Evidence = neutral (P/C/O told apart by letter, not hue) so colour is free for achievement */
    --ev:#5a6474; --ev-bg:#eef1f6; --ev-line:#d7dde9;
    --pro:var(--ev); --pro-bg:var(--ev-bg); --pro-line:var(--ev-line);
    --con:var(--ev); --con-bg:var(--ev-bg); --con-line:var(--ev-line);
    --obs:var(--ev); --obs-bg:var(--ev-bg); --obs-line:var(--ev-line);
    --warn:#c67a12; --warn-bg:#fbf0da; --warn-line:#f0dcb0;   /* attention: no-evidence / low-confidence / single-form */
    --lv0:#93a0b8; --lv0-bg:#eef1f7;
    --lv1:#7f90b6; --lv1-bg:#edf0f7;   /* Beginning = cool/early, not warning-orange */
    --lv2:#c9a52d; --lv2-bg:#f7f0d6;
    --lv3:#3f9d5a; --lv3-bg:#e4f3e8;
    --lv4:#2f6fdb; --lv4-bg:#e3edfb;
    --shadow:0 1px 2px rgba(20,32,58,.05),0 8px 24px -12px rgba(20,32,58,.18);
    --shadow-lg:0 24px 60px -24px rgba(15,27,51,.45);
    --radius:14px;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
    --ground:#0a1120; --surface:#111a2e; --surface-2:#16223a; --surface-3:#1b2842;
    --ink:#e9f0fc; --ink-soft:#b2c0da; --muted:#7f8eac; --faint:#61708e;
    --line:#243149; --line-strong:#33425f;
    --navy:#080f1d; --navy-ink:#e9f0fc; --navy-soft:#8090ad; --navy-line:#1c2740; --navy-active:#16223c;
    --accent:#6b8cf5; --accent-soft:#16223f; --accent-ink:#0a1120;
    --brand:#2bc7b6; --brand-ink:#062a26;
    --ev:#a3afc6; --ev-bg:#1b2334; --ev-line:#2c3752;
    --pro:var(--ev); --pro-bg:var(--ev-bg); --pro-line:var(--ev-line);
    --con:var(--ev); --con-bg:var(--ev-bg); --con-line:var(--ev-line);
    --obs:var(--ev); --obs-bg:var(--ev-bg); --obs-line:var(--ev-line);
    --warn:#e6a83f; --warn-bg:#2a2210; --warn-line:#4a3c18;
    --lv0:#8592aa; --lv0-bg:#19233a;
    --lv1:#8fa0c8; --lv1-bg:#1a2135;
    --lv2:#d8bb45; --lv2-bg:#2a2611;
    --lv3:#5cb877; --lv3-bg:#132a1b;
    --lv4:#6394ee; --lv4-bg:#132139;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
    --shadow-lg:0 30px 70px -28px rgba(0,0,0,.75);
  }}
  :root[data-theme="dark"]{
    --ground:#0a1120; --surface:#111a2e; --surface-2:#16223a; --surface-3:#1b2842;
    --ink:#e9f0fc; --ink-soft:#b2c0da; --muted:#7f8eac; --faint:#61708e;
    --line:#243149; --line-strong:#33425f;
    --navy:#080f1d; --navy-ink:#e9f0fc; --navy-soft:#8090ad; --navy-line:#1c2740; --navy-active:#16223c;
    --accent:#6b8cf5; --accent-soft:#16223f; --accent-ink:#0a1120;
    --brand:#2bc7b6; --brand-ink:#062a26;
    --ev:#a3afc6; --ev-bg:#1b2334; --ev-line:#2c3752;
    --pro:var(--ev); --pro-bg:var(--ev-bg); --pro-line:var(--ev-line);
    --con:var(--ev); --con-bg:var(--ev-bg); --con-line:var(--ev-line);
    --obs:var(--ev); --obs-bg:var(--ev-bg); --obs-line:var(--ev-line);
    --warn:#e6a83f; --warn-bg:#2a2210; --warn-line:#4a3c18;
    --lv0:#8592aa; --lv0-bg:#19233a;
    --lv1:#8fa0c8; --lv1-bg:#1a2135;
    --lv2:#d8bb45; --lv2-bg:#2a2611;
    --lv3:#5cb877; --lv3-bg:#132a1b;
    --lv4:#6394ee; --lv4-bg:#132139;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
    --shadow-lg:0 30px 70px -28px rgba(0,0,0,.75);
  }

  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--ink);font-family:"Public Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45}
  h1,h2,h3,h4,.disp{font-family:"Archivo","Public Sans",sans-serif;margin:0}
  button{font-family:inherit}
  .tnum{font-variant-numeric:tabular-nums}
  .eyebrow{font-family:"Archivo",sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:700;color:var(--muted)}

  /* ── App shell ── */
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
  .sidebar{background:var(--navy);color:var(--navy-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid var(--navy-line)}
  .brand{padding:20px 20px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--navy-line)}
  .brand-mark{width:36px;height:36px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:none;font-family:"Archivo",system-ui,sans-serif;font-weight:800;font-size:14px;color:#fff;letter-spacing:.03em;box-shadow:0 4px 12px -5px rgba(18,179,164,.85)}
  .brand-name{font-family:"Archivo",system-ui,sans-serif;font-weight:800;font-size:15px;letter-spacing:-.01em;line-height:1.05}
  .brand-sub{font-size:11px;color:var(--navy-soft);letter-spacing:.02em}
  .nav{padding:12px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
  .nav-label{font-family:"Archivo",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.13em;font-size:10px;font-weight:700;color:var(--navy-soft);padding:14px 12px 6px}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:var(--navy-soft);text-decoration:none;font-size:13.5px;font-weight:500;cursor:pointer;border:1px solid transparent}
  .nav a svg{width:17px;height:17px;flex:none}
  .nav a:hover{background:var(--navy-active);color:var(--navy-ink)}
  .nav a.active{background:#ffffff;color:var(--navy);border-color:#fff;font-weight:700}
  .nav a.active svg{color:var(--brand)}
  .nav a .soon{margin-left:auto;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--navy-soft);background:rgba(255,255,255,.06);padding:2px 6px;border-radius:20px;font-weight:600}
  .side-foot{padding:14px 16px;border-top:1px solid var(--navy-line);display:flex;align-items:center;gap:10px}
  .avatar{width:30px;height:30px;border-radius:50%;background:#38456b;display:grid;place-items:center;font-family:"Archivo",system-ui,sans-serif;font-weight:700;font-size:12px;color:#dbe3f7;flex:none}
  .side-foot .who{font-size:12.5px;font-weight:600;line-height:1.2}
  .side-foot .who small{display:block;color:var(--navy-soft);font-weight:400;font-size:11px}

  .main{display:flex;flex-direction:column;min-width:0}

  /* ── Top bar ── */
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .crumb{font-family:"Archivo",system-ui,sans-serif;font-weight:700;font-size:15px;letter-spacing:-.01em}
  .crumb small{display:block;font-family:"Public Sans",system-ui,sans-serif;font-weight:400;font-size:11.5px;color:var(--muted);letter-spacing:0}
  .selectors{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
  .selectwrap{position:relative;display:flex;align-items:center}
  #areaNavWrap{display:none}
  #areaNav{min-width:172px;font-weight:700}
  .selectwrap>svg.lead{position:absolute;left:11px;width:15px;height:15px;color:var(--muted);pointer-events:none}
  .selectwrap>svg.caret{position:absolute;right:9px;width:15px;height:15px;color:var(--muted);pointer-events:none}
  select.picker{appearance:none;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--ink);border-radius:10px;padding:8px 30px 8px 33px;font-size:13px;font-weight:600;font-family:"Public Sans",system-ui,sans-serif;cursor:pointer;min-width:120px}
  select.picker:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .picker.course{min-width:190px}
  .seg{display:inline-flex;background:var(--surface-3);border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{border:none;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .seg button svg{width:15px;height:15px}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,32,58,.12)}
  .icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink-soft);display:grid;place-items:center;cursor:pointer}
  .icon-btn:hover{color:var(--accent);border-color:var(--accent)}
  .icon-btn svg{width:17px;height:17px}

  .scroll{overflow:auto;flex:1;padding:24px 26px 80px}

  /* ── Student header card ── */
  .studentcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:20px;display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center}
  .st-avatar{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;font-family:"Archivo",system-ui,sans-serif;font-weight:800;font-size:20px;color:#fff;flex:none}
  .st-id h2{font-size:22px;letter-spacing:-.02em;line-height:1.1}
  .st-id .meta{color:var(--muted);font-size:13px;margin-top:3px;display:flex;gap:14px;flex-wrap:wrap}
  .st-id .meta b{color:var(--ink-soft);font-weight:600}
  .st-stats{display:flex;gap:26px;align-items:center}
  .stat .n{font-family:"Archivo",system-ui,sans-serif;font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1}
  .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-top:5px}
  .ring{--p:0;width:66px;height:66px;border-radius:50%;background:conic-gradient(var(--lv3) calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center;flex:none}
  .ring>div{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:"Archivo",system-ui,sans-serif;font-weight:800;font-size:15px}
  .ring small{font-size:9px;color:var(--muted)}

  /* ── Progress bar of levels ── */
  .distrib{display:flex;height:10px;border-radius:20px;overflow:hidden;margin-top:14px;border:1px solid var(--line)}
  .distrib i{display:block;height:100%}

  /* ── Legend ── */
  .legendbar{display:flex;gap:22px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:0 4px}
  .legend-group{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .legend-group .lg-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;font-family:"Archivo"}
  .chiplg{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-soft)}
  .chiplg .sw{width:12px;height:12px;border-radius:4px}
  .dotlg{width:10px;height:10px;border-radius:50%}

  /* ── Module + outcome table ── */
  .module{margin-bottom:22px}
  .module-head{display:flex;align-items:center;gap:12px;margin:0 4px 10px}
  .module-tag{font-family:"Archivo",system-ui,sans-serif;font-weight:800;font-size:12px;letter-spacing:.03em;color:var(--accent);background:var(--accent-soft);padding:4px 9px;border-radius:7px}
  .module-head h3{font-size:15px;letter-spacing:-.01em}
  .module-head .mcount{font-size:12px;color:var(--muted);font-weight:500}
  .module-head .mline{flex:1;height:1px;background:var(--line)}

  .otable{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .orow{display:grid;grid-template-columns:minmax(0,1fr) 168px 250px 96px;gap:0;align-items:center;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
  .orow:last-child{border-bottom:none}
  .orow:hover{background:var(--surface-2)}
  .orow.sel{background:var(--accent-soft)}
  .o-main{padding:14px 16px;min-width:0}
  .o-code{display:inline-flex;align-items:center;gap:7px;font-family:"Archivo",system-ui,sans-serif;font-weight:700;font-size:11.5px;color:var(--accent);letter-spacing:.02em;margin-bottom:3px}
  .o-code .official{color:var(--faint);font-weight:600}
  .o-title{font-size:14px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
  .o-friendly{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}

  /* evidence cell */
  .o-evi{padding:12px 10px;display:flex;gap:7px;justify-content:center}
  .evchip{--c:var(--muted);--bg:var(--surface-3);width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;position:relative;color:var(--faint)}
  .evchip .lab{font-family:"Archivo",system-ui,sans-serif;font-weight:800;font-size:9.5px;letter-spacing:.02em}
  .evchip .ct{font-size:10px;font-weight:700;line-height:1}
  .evchip.on{background:var(--bg);border-color:var(--c);color:var(--c)}
  .evchip:hover{border-color:var(--c);color:var(--c)}
  .evchip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .evchip .dot{position:absolute;top:-4px;right:-4px;width:15px;height:15px;border-radius:50%;background:var(--c);color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface)}

  /* achievement segmented */
  .o-ach{padding:12px 14px}
  .achbar{display:flex;gap:4px;margin-bottom:5px}
  .achseg{flex:1;height:22px;border-radius:6px;background:var(--surface-3);border:1px solid var(--line);cursor:pointer;position:relative;transition:transform .08s}
  .achseg:hover{transform:translateY(-1px)}
  .achseg:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .ach-label{font-size:11.5px;font-weight:700;font-family:"Archivo",system-ui,sans-serif;letter-spacing:.01em;display:flex;align-items:center;gap:5px}
  .ach-label .conf{margin-left:auto;font-size:10px;font-weight:600;color:var(--muted);font-family:"Public Sans",system-ui,sans-serif;display:inline-flex;gap:2px;align-items:center}
  .conf .cdot{width:6px;height:6px;border-radius:50%;background:var(--line-strong)}
  .conf .cdot.on{background:var(--lv3)}

  .o-arrow{padding:12px;display:grid;place-items:center;color:var(--faint)}
  .o-arrow svg{width:18px;height:18px}
  .o-flags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
  .flag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:.02em;display:inline-flex;align-items:center;gap:4px}
  .flag.warn{background:var(--warn-bg);color:var(--warn)}
  .flag.gap{background:var(--lv0-bg);color:var(--ink-soft)}

  /* ── Class matrix ── */
  .matrixwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto}
  table.matrix{border-collapse:separate;border-spacing:0;width:100%;min-width:760px}
  table.matrix th,table.matrix td{padding:0;text-align:center}
  table.matrix thead th{position:sticky;top:0;background:var(--surface);z-index:2;padding:10px 6px;border-bottom:1px solid var(--line-strong);font-family:"Archivo",system-ui,sans-serif;font-weight:700;font-size:11px;color:var(--ink-soft)}
  table.matrix thead th.stu{text-align:left;padding-left:16px;min-width:150px;position:sticky;left:0;z-index:3}
  table.matrix thead th .om{display:block;font-size:9px;color:var(--faint);font-weight:600}
  table.matrix tbody th.stu{position:sticky;left:0;background:var(--surface);text-align:left;padding:8px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px;z-index:1;cursor:pointer}
  table.matrix tbody th.stu:hover{color:var(--accent)}
  table.matrix tbody th .sav{width:24px;height:24px;border-radius:7px;display:inline-grid;place-items:center;color:#fff;font-size:10px;font-family:"Archivo",system-ui,sans-serif;font-weight:700;margin-right:9px;vertical-align:middle}
  table.matrix td{border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
  .mcell{width:38px;height:38px;margin:4px auto;border-radius:9px;display:grid;place-items:center;font-family:"Archivo",system-ui,sans-serif;font-weight:800;font-size:11px;cursor:pointer;color:#fff}
  .mcell:hover{outline:2px solid var(--ink);outline-offset:1px}
  .mcell.empty{background:var(--surface-3)!important;color:var(--faint)}

  /* ── Inspector drawer ── */
  .scrim{position:fixed;inset:0;background:rgba(10,17,32,.42);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  .scrim.open{opacity:1;pointer-events:auto}
  .inspector{position:fixed;top:0;right:0;height:100vh;width:420px;max-width:92vw;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1);z-index:50;display:flex;flex-direction:column}
  .inspector.open{transform:none}
  .insp-head{padding:18px 20px 16px;border-bottom:1px solid var(--line);position:relative}
  .insp-head .close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;cursor:pointer;color:var(--ink-soft)}
  .insp-head .close:hover{color:var(--accent);border-color:var(--accent)}
  .insp-body{padding:18px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px}
  .insp-section .eyebrow{margin-bottom:8px}
  .insp-title{font-size:19px;letter-spacing:-.02em;line-height:1.2;margin:8px 40px 4px 0}
  .insp-friendly{font-size:13.5px;color:var(--ink-soft);line-height:1.5;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .lookfor{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px}
  .lookfor li{display:flex;gap:9px;font-size:13px;color:var(--ink-soft);line-height:1.4}
  .lookfor li svg{width:16px;height:16px;color:var(--pro);flex:none;margin-top:2px}
  .ach-picker{display:flex;flex-direction:column;gap:6px}
  .ach-opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);cursor:pointer;background:var(--surface)}
  .ach-opt:hover{border-color:var(--line-strong)}
  .ach-opt .sw{width:14px;height:14px;border-radius:5px;flex:none}
  .ach-opt .nm{font-weight:600;font-size:13.5px}
  .ach-opt .ds{font-size:11.5px;color:var(--muted);margin-left:auto}
  .ach-opt.on{border-color:currentColor;background:var(--bg)}
  .evid-list{display:flex;flex-direction:column;gap:8px}
  .evid{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-left-width:3px;border-radius:9px;background:var(--surface-2);font-size:12.5px}
  .evid .etag{font-family:"Archivo",system-ui,sans-serif;font-weight:800;font-size:9.5px;padding:2px 6px;border-radius:5px;flex:none}
  .evid .enote{color:var(--ink-soft);line-height:1.4}
  .evid .edate{color:var(--faint);font-size:11px;margin-top:2px}

  /* ── Shared area chrome ── */

  .ochip{display:inline-flex;align-items:center;font:600 11px/1 "Public Sans",sans-serif;color:var(--accent);background:var(--accent-soft);border:1px solid transparent;padding:5px 8px;border-radius:6px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .tablehead{display:grid;padding:11px 16px;border-bottom:1px solid var(--line-strong);font-family:"Archivo",system-ui,sans-serif;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .linkbtn{background:none;border:none;color:var(--accent);font:600 12.5px "Public Sans";cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:0}

  .flag-inline{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:4px}

  /* Courses grid */

  /* Curriculum coverage rows */

<script>
(function(){
  "use strict";
  const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

  // ── Achievement scale (course-configurable in the real build) ──
  // ── Per-course achievement scales (Teach OS contract) ──
  // NS standards-based courses: 4 levels (mastery-1-4). IB Digital Society: IB grades 1–7.
  // level 0 is always "Not assessed" (no evidence yet). Index === k for direct lookup.
  const COURSE_SCALE={CP12:"mastery-1-4",MM12:"mastery-1-4",COM11:"mastery-1-4",IBDS:"ib-1-7"};
  const IBHEX={1:"#c0483f",2:"#cf6d3a",3:"#d69a34",4:"#c9b52f",5:"#6fae4a",6:"#3f9d6b",7:"#2f7fd0"};
  const _NOTSET={k:0,name:"Not assessed",short:"·",desc:"no evidence yet",c:"var(--lv0)",bg:"var(--lv0-bg)"};
  const _SCALES={
    "mastery-1-4":[_NOTSET,
      {k:1,name:"Beginning",short:"Bg",desc:"getting started",c:"var(--lv1)",bg:"var(--lv1-bg)"},
      {k:2,name:"Developing",short:"Dv",desc:"with support",c:"var(--lv2)",bg:"var(--lv2-bg)"},
      {k:3,name:"Secure",short:"Se",desc:"independently",c:"var(--lv3)",bg:"var(--lv3-bg)"},
      {k:4,name:"Extending",short:"Ex",desc:"beyond expectations",c:"var(--lv4)",bg:"var(--lv4-bg)"}],
    "ib-1-7":[_NOTSET].concat([1,2,3,4,5,6,7].map(n=>({k:n,name:"IB "+n,short:String(n),desc:"grade "+n,c:IBHEX[n],bg:"color-mix(in srgb, "+IBHEX[n]+" 20%, transparent)"})))
  };
  function scaleId(cid){return COURSE_SCALE[cid]||"mastery-1-4";}
  function LV(cid){return _SCALES[scaleId(cid)];}      // [Not assessed, ...real levels]; index === k
  function topK(cid){const s=LV(cid);return s[s.length-1].k;}
  function passK(cid){return scaleId(cid)==="ib-1-7"?4:3;}   // "meeting+" threshold: IB 4+, mastery Secure(3)+
  function scaleName(cid){return scaleId(cid)==="ib-1-7"?"IB 1–7":"Standards 1–4";}
  const FORMS={Pro:{name:"Product",c:"var(--pro)",bg:"var(--pro-bg)"},Con:{name:"Conversation",c:"var(--con)",bg:"var(--con-bg)"},Obs:{name:"Observation",c:"var(--obs)",bg:"var(--obs-bg)"}};

  // ── Seed course & outcomes (all fictional) ──
  // Official outcomes are transcribed verbatim from the Nova Scotia curriculum documents
  // (CP12 2015/2019; Multimedia 12 2008; Communications Technology 11 & 12 2009), cleaned only of
  // OCR spacing artifacts. `friendly` and `look` are teacher/student aids, NOT the official wording.
  const COURSES={
    CP12:{name:"Computer Programming 12",code:"CP12",section:"A",term:"Semester 1 · 2025–26",source:"NS Learning Outcomes Framework, Grades 10–12 (2015/2019)",
      modules:[
        {tag:"M1",name:"Problem Solving in Computer Programming",outcomes:[
          {id:"1.1",title:"Number systems in data storage",official:"demonstrate an understanding of the role of number systems in data storage",friendly:"I understand how computers use number systems (like binary and hex) to store data.",look:["Converts between binary, decimal and hex","Explains how data is stored in bits and bytes","Relates number systems to memory/storage"]},
          {id:"1.2",title:"Boolean logic & operators",official:"apply mathematical concepts, including Boolean logic and operators",friendly:"I can use math ideas and true/false logic (and, or, not) in my programs.",look:["Writes correct Boolean expressions","Uses arithmetic and logical operators correctly","Predicts the result of an expression"]},
          {id:"1.3",title:"Define a problem (OO analysis)",official:"define a problem in explicit terms using object-oriented analysis",friendly:"I can describe a problem clearly using objects, their data, and their behaviours.",look:["States the problem precisely","Identifies objects, attributes and actions","Separates the problem from the solution"]},
          {id:"1.4",title:"Outline solution strategies",official:"identify and outline strategies to solve a range of problems",friendly:"I can come up with and outline different strategies to solve a problem.",look:["Proposes more than one approach","Outlines steps before coding","Chooses a strategy and justifies it"]},
          {id:"1.5",title:"Apply problem-solving skills",official:"apply a range of problem-solving skills",friendly:"I can actually use problem-solving skills to work through challenges.",look:["Breaks problems into parts","Tries, tests and adjusts","Persists through obstacles"]},
          {id:"1.6",title:"Ethical, moral & legal issues in IT",official:"demonstrate an understanding of ethical, moral, and legal issues in information technology",friendly:"I understand the ethical, moral, and legal sides of technology.",look:["Identifies IP, privacy and licensing issues","Explains responsible use","Applies ethics to a scenario"]},
          {id:"1.7",title:"Explore IT careers",official:"investigate a range of related career opportunities",friendly:"I can explore careers connected to computer programming.",look:["Names relevant career paths","Describes the skills each needs","Connects course work to careers"]},

        {tag:"M2",name:"Fundamentals of Programming",outcomes:[

          {id:"2.2",title:"Identify & frame problems",official:"identify and frame problems",friendly:"I can spot the real problem and frame it clearly before solving it.",look:["Distinguishes symptoms from causes","States inputs, outputs and constraints","Frames a solvable version of the problem"]},
          {id:"2.3",title:"Data structures",official:"demonstrate an understanding of how data structures are used to solve problems",friendly:"I understand how data structures help solve problems.",look:["Chooses an appropriate data structure","Explains why it fits","Uses it correctly in code"]},
          {id:"2.4",title:"Plan a solution",official:"use appropriate methods and terms to develop a plan to solve a problem",friendly:"I can plan a solution using the right methods and terms.",look:["Produces a clear plan (pseudocode/flow)","Uses correct terminology","Plan maps to the requirements"]},
          {id:"2.5",title:"Implement the plan in code",official:"apply a plan to solve a problem using a programming language",friendly:"I can turn my plan into working code.",look:["Code follows the plan","Program produces correct output","Handles the main cases"]},

        ]},
        {tag:"M3",name:"Applied Problem Solving",outcomes:[
          {id:"3.1",title:"Build tools & components",official:"work individually and collaboratively to develop program tools, components, and strategies to create solutions",friendly:"I can work alone and with others to build the parts of a solution.",look:["Contributes reusable components","Collaborates effectively","Integrates parts into a solution"]},
          {id:"3.2",title:"Design a user interface",official:"create a user interface using effective design principles",friendly:"I can design a user interface that's clear and easy to use.",look:["Clear layout and navigation","Applies design principles","Considers the user"]},
          {id:"3.3",title:"Input / output operations",official:"apply input/output operations",friendly:"I can get input and produce output correctly in my programs.",look:["Reads input safely","Produces correct output","Handles I/O errors"]},
          {id:"3.4",title:"Manipulate data",official:"apply data-manipulation techniques",friendly:"I can transform and manipulate data to get what I need.",look:["Sorts, searches and filters data","Transforms data correctly","Chooses efficient techniques"]},
          {id:"3.5",title:"Format data",official:"apply data-formatting principles",friendly:"I can format data so it's presented clearly and correctly.",look:["Formats numbers, dates and text properly","Consistent presentation","Meets output requirements"]},
          {id:"3.6",title:"Error handling & validation",official:"apply error-handling techniques/validation",friendly:"I can validate input and handle errors so my program doesn't crash.",look:["Validates input","Handles errors gracefully","Program recovers or fails safely"]},
        ]},
        {tag:"M4",name:"Project Development",outcomes:[
          {id:"4.1",title:"Analyze the problem",official:"analyze a problem",friendly:"I can analyze a real problem before starting a project.",look:["Gathers requirements","Identifies constraints","Defines success criteria"]},
          {id:"4.2",title:"Develop a project plan",official:"develop a project plan, including definition, scope, roles, resources, steps, and deadlines, for a solution",friendly:"I can plan a project with scope, roles, steps and deadlines.",look:["Defines scope and roles","Lists steps and resources","Sets realistic deadlines"]},
          {id:"4.3",title:"Collaborate effectively",official:"demonstrate the collaborative skills and behaviours required to work with others",friendly:"I can work well with others on a shared project.",look:["Shares work fairly","Communicates and listens","Resolves issues constructively"]},
          {id:"4.4",title:"Find & evaluate resources",official:"identify information needs and locate, evaluate, and select resources",friendly:"I can find, judge and choose the resources a project needs.",look:["Identifies what's needed","Evaluates source quality","Selects and credits resources"]},
          {id:"4.5",title:"Build & deploy",official:"build and deploy a solution",friendly:"I can build a working solution and get it running for real.",look:["Implements the planned solution","Deploys or publishes it","Solution meets requirements"]},
          {id:"4.6",title:"Document the project",official:"create documentation associated with the project",friendly:"I can document my project so others can understand and use it.",look:["Explains what it does and how","Documents setup and use","Audience-appropriate"]},
          {id:"4.7",title:"Test & refine",official:"test and refine the solution",friendly:"I can test my solution and improve it based on what I find.",look:["Tests systematically","Finds and fixes issues","Refines based on results"]},
          {id:"4.8",title:"Present the solution",official:"present the solution",friendly:"I can present my solution clearly to an audience.",look:["Clear, organized presentation","Explains decisions","Responds to questions"]},
          {id:"4.9",title:"Reflect on the work",official:"reflect on the solution, the process, and their own learning",friendly:"I can reflect honestly on my solution, process and learning.",look:["Evaluates what worked","Identifies improvements","Connects to own learning"]},
          {id:"4.10",title:"Explore IT education & careers",official:"explore various educational and career paths in information technology fields",friendly:"I can explore education and career paths in IT.",look:["Researches pathways","Relates them to own goals","Identifies next steps"]},
        ]},
      ]},
    MM12:{"name":"Multimedia 12","code":"MM12","section":"B","term":"Semester 1 · 2026–27","source":"NS Multimedia 12 curriculum (teach-os outcomes.json)","modules":[{"tag":"M1","name":"Creating and Manipulating Images","outcomes":[{"id":"1.1","title":"apply techniques and procedures needed to ma…","official":"apply techniques and procedures needed to manipulate images (including text) in a range of media, including digital and electronic media","friendly":"I can use the right techniques to edit and manipulate images across media.","look":["Uses tools and techniques confidently","Works non-destructively"]},{"id":"1.2","title":"demonstrate an understanding of the cultural…","official":"demonstrate an understanding of the cultural, historical, and emotional impact of other people’s images by examining their form and content","friendly":"I can examine images and understand their cultural, historical and emotional impact.","look":["Analyzes form and content","Explains impact and context"]},{"id":"1.3","title":"demonstrate an awareness of the procedures i…","official":"demonstrate an awareness of the procedures involved in the production of images in a range of digital and electronic media","friendly":"I understand the steps involved in producing images in different media.","look":["Describes the production workflow","Identifies tools and stages"]},{"id":"1.4","title":"apply principles of art and design to create…","official":"apply principles of art and design to create digital and electronic images","friendly":"I can use art and design principles to create strong images.","look":["Applies design principles","Uses intentional composition"]},{"id":"1.5","title":"construct digital and electronic images whic…","official":"construct digital and electronic images which communicate ideas and concepts","friendly":"I can create images that clearly communicate an idea.","look":["Message is clear","Choices serve the concept"]}]},{"tag":"M2","name":"Creating and Manipulating Motion Graphics","outcomes":[{"id":"2.1","title":"apply techniques and procedures needed to cr…","official":"apply techniques and procedures needed to create motion graphics","friendly":"I can use the techniques needed to make motion graphics.","look":["Uses motion tools and techniques","Motion is smooth and intentional"]},{"id":"2.2","title":"demonstrate an understanding of the cultural…","official":"demonstrate an understanding of the cultural, historical, and emotional impact of other people’s motion graphics by examining their form and content","friendly":"I can examine motion graphics and understand their impact.","look":["Analyzes form and content","Explains impact and context"]},{"id":"2.3","title":"demonstrate an awareness of the procedures i…","official":"demonstrate an awareness of the procedures involved in the production of motion graphics in a range of digital and electronic media","friendly":"I understand how motion graphics are produced across media.","look":["Describes the workflow","Identifies stages and tools"]},{"id":"2.4","title":"apply principles of art and design to create…","official":"apply principles of art and design to create motion graphics","friendly":"I can apply art and design principles to motion graphics.","look":["Applies design principles","Timing and hierarchy work"]},{"id":"2.5","title":"constructed motion graphics which communicat…","official":"constructed motion graphics which communicate ideas and concepts","friendly":"I can make motion graphics that clearly communicate an idea.","look":["Message is clear","Motion serves the concept"]}]},{"tag":"M3","name":"Sound","outcomes":[{"id":"3.1","title":"demonstrate an understanding the elements of…","official":"demonstrate an understanding the elements of sound, including tone, pitch, volume, shape, and harmonics","friendly":"I understand the elements of sound — tone, pitch, rhythm and more.","look":["Identifies sound elements","Uses correct vocabulary"]},{"id":"3.2","title":"create and manipulate sound products from a …","official":"create and manipulate sound products from a range of sources, including music, narration and effects","friendly":"I can create and edit sound from music, narration and effects.","look":["Records and edits cleanly","Mixes sources well"]},{"id":"3.3","title":"demonstrate an understanding of the cultural…","official":"demonstrate an understanding of the cultural, historical, and emotional impact of other people’s sound products","friendly":"I can examine sound products and understand their cultural and emotional impact.","look":["Analyzes form and content","Explains impact and context"]},{"id":"3.4","title":"by examining the form and content; and relat…","official":"by examining the form and content; and relationship or potential relationship of sound products to other multimedia elements","friendly":"I can explain how sound relates to the other elements of a multimedia piece.","look":["Relates sound to image/motion","Justifies the relationship"]},{"id":"3.5","title":"demonstrate an awareness of the procedures i…","official":"demonstrate an awareness of the procedures involved in the production and application of sound products in a range of media","friendly":"I understand how sound products are produced and used across media.","look":["Describes the workflow","Identifies tools and stages"]},{"id":"3.6","title":"apply principles of art and design to create…","official":"apply principles of art and design to create sound products","friendly":"I can apply design principles to create effective sound.","look":["Sound design is intentional","Serves the piece"]},{"id":"3.7","title":"construct and manipulate sound products whic…","official":"construct and manipulate sound products which communicate ideas and concepts","friendly":"I can create sound that clearly communicates an idea.","look":["Message or mood is clear","Choices serve the concept"]}]},{"tag":"M4","name":"Collaborative Project and Personal Portfolio","outcomes":[{"id":"4.1","title":"apply skills, principles, techniques, and pr…","official":"apply skills, principles, techniques, and processes of art and design to communicate ideas and concepts to an identified audience for a specified purpose","friendly":"I can use design skills to communicate to a specific audience and purpose.","look":["Fits audience and purpose","Applies the design process"]},{"id":"4.2","title":"demonstrate an understanding of the cultural…","official":"demonstrate an understanding of the cultural, historical, and emotional impact of other people’s multimedia products by examining their form and content, audience and purpose","friendly":"I can examine multimedia products and understand their impact, audience and purpose.","look":["Analyzes form, content and audience","Explains impact"]},{"id":"4.3","title":"collaboratively create a customized multimed…","official":"collaboratively create a customized multimedia authored project using software program(s) and external sources","friendly":"I can work with others to build a custom multimedia project.","look":["Contributes and collaborates","Integrates sources and tools"]},{"id":"4.4","title":"independently select, organize and refine a …","official":"independently select, organize and refine a range of multimedia products that illustrate learning throughout the course to create a multimedia- authored personal portfolio","friendly":"I can independently curate a portfolio that shows my learning.","look":["Selects and organizes best work","Refines for quality"]},{"id":"4.5","title":"explore various educational and career paths…","official":"explore various educational and career paths in multimedia- related fields","friendly":"I can explore education and career paths in multimedia.","look":["Researches pathways","Relates them to own goals"]}]}]},
    COM11:{"name":"Communications Technology 11","code":"COM11","section":"A","term":"Semester 1 · 2026–27","source":"NS Communications Technology 11 & 12 guide (2009) — Grade 11, selected route","modules":[{"tag":"M1","name":"Fundamentals of Communications Technology","outcomes":[{"id":"1.1","title":"History of communication","official":"demonstrate an understanding of the history of communication","friendly":"I understand how communication has developed over time.","look":["Describes key developments","Connects past to present"]},{"id":"1.2","title":"Career strengths (comm tech)","official":"investigate their strengths related to career options in communications technology","friendly":"I can identify my strengths and connect them to comm-tech careers.","look":["Names personal strengths","Links them to career options"]},{"id":"1.3","title":"Professional portfolio","official":"generate a professional portfolio representing a collection of work completed throughout the course using the design process","friendly":"I can build a professional portfolio of my course work using the design process.","look":["Curates representative work","Follows the design process"]},{"id":"1.4","title":"Persuade / entertain an audience","official":"determine and create solutions to design problems that can persuade or entertain an audience using a variety of electronic communications tools","friendly":"I can create media that persuades or entertains an audience.","look":["Solution fits the goal","Uses appropriate tools"]},{"id":"1.5","title":"Social & environmental impact","official":"demonstrate an understanding of the social and environmental impacts of communications technology","friendly":"I understand how communications technology affects society and the environment.","look":["Identifies impacts","Explains trade-offs"]},{"id":"1.6","title":"Life-cycle analysis","official":"demonstrate an understanding of life-cycle analysis of modern communications equipment and processes","friendly":"I understand the life cycle of communications equipment and processes.","look":["Describes life-cycle stages","Considers sustainability"]},{"id":"1.7","title":"Safe practices","official":"demonstrate safe practices when using communications technology tools and equipment","friendly":"I can work safely with communications technology tools and equipment.","look":["Follows safety procedures","Uses equipment responsibly"]}]},{"tag":"M2","name":"Digital Photography","outcomes":[{"id":"2.1","title":"Camera operation & care","official":"demonstrate an understanding of the basic operation and care of a digital camera","friendly":"I can operate and care for a digital camera properly.","look":["Handles the camera correctly","Maintains equipment"]},{"id":"2.2","title":"Photo technique & composition","official":"practice various photographic techniques and photographic composition using a single lens reflex camera and tripod","friendly":"I can use photographic techniques and composition with an SLR and tripod.","look":["Applies composition rules","Stable, intentional shots"]},{"id":"2.3","title":"Scene lighting","official":"explore various scene lighting techniques and the effects of it","friendly":"I can use different lighting techniques and understand their effects.","look":["Controls lighting","Explains the effect"]},{"id":"2.4","title":"Resolution & file formats","official":"demonstrate an understanding of image resolution and digital file formats","friendly":"I understand image resolution and which file formats to use.","look":["Chooses correct resolution","Picks an appropriate format"]}]},{"tag":"M4","name":"Graphic Design","outcomes":[{"id":"4.1","title":"Principles & elements of design","official":"demonstrate an understanding of the principles and elements of design","friendly":"I understand the elements and principles of design.","look":["Names elements and principles","Spots them in work"]},{"id":"4.2","title":"Colour theory","official":"demonstrate effective use o   function seedFor(cid,sid){

    let h=0; for(const ch of (cid+sid)) h=(h*31+ch.charCodeAt(0))>>>0;
    const rnd=()=>{h=(h*1103515245+12345)>>>0;return h/4294967296;};
    const st={};
    outs.forEach(({m,o},i)=>{
      const roll=rnd();
      const _mx=topK(cid); let lvl = roll<.12?0 : 1+Math.floor(rnd()*_mx);
      const ev=[];
      const push=(f,note,d)=>ev.push({f,note,date:d});
      if(lvl>=1 && rnd()>.25) push("Pro",sampleNote("Pro",o),daysAgo(cid,sid,i,3));

  // ── Curriculum Design ──

    let h=`<div class="capgrid"><div><div class="area-intro"><div><h2>Outcome-first design</h2><p>Start from the official outcomes, then reverse-engineer the exercises, labs, conversations and observations that prove them.</p></div><button class="btn primary" id="impOut">${IC.up}Import outcomes</button></div>

      h+=`<div class="module-head" style="margin:16px 4px 8px"><span class="module-tag">${m.tag}</span><h3 style="font-size:14px">${m.name}</h3><span class="mline"></span></div><div class="card">`;

          <div class="cov-forms">${["Pro","Con","Obs"].map(f=>`<span class="formdot ${forms.has(f)?'on':''}" style="${forms.has(f)?`background:${FORMS[f].c};border-color:${FORMS[f].c}`:''}">${f}</span>`).join("")}</div>
          <div class="cov-acts">${acts.length?`<span class="actpill">${acts.length} activit${acts.length===1?"y":"ies"}</span>${acts.some(a=>a.formSum==="Sum")?`<span class="fchip sum">Sum</span>`:`<span class="fchip form">Form only</span>`}<span style="font-size:11px;color:var(--muted);align-self:center">${studentsWithEvidence(cid,m.tag+"|"+oid)} w/ evidence</span>`:'<span class="o-friendly">No linked activity</span>'}</div>

  }

    h+=`</div>
      <div class="area-intro" style="margin-top:18px"><div><h2>PowerSchool name builder</h2><p>Teach OS convention: <b>{F|S}-{O|C|P}-{OUTCOME} | Title</b> — e.g. <span class="mono">F-P-CP12-1.1 | Number Systems &amp; Logic Drill</span>. <b>F</b>=formative/practice, <b>S</b>=summative/component · <b>O/C/P</b>=Observation/Conversation/Product · OUTCOME is the course-prefixed outcome code · title ≤80 chars. This matches the Teach OS CSV export (parity across both apps); PowerSchool still matches rows on Student Number. Duplicates within a course are flagged.</p></div></div>
      <div class="card" style="padding:16px 18px"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">

        <div class="cap-field" style="margin:0"><label>Evidence</label><select id="nbForm" class="statuspick"><option value="Pro">Product · P</option><option value="Con">Conversation · C</option><option value="Obs">Observation · O</option></select></div>
        <div class="cap-field" style="margin:0;min-width:210px"><label>Outcome</label><select id="nbOut" class="statuspick">${allOutcomes(cid).map(o=>`<option value="${o.o.id}">${psOutcomeCode(cid,o.o.id)} · ${escH(o.o.title)}</option>`).join("")}</select></div>
        <div class="cap-field" style="flex:1;min-width:150px;margin:0"><label>Assignment</label><input id="nbName" class="statuspick" style="width:100%;padding:8px 10px" value="Security Door"></div>
      </div><div style="display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap"><span class="mono" id="nbPreview" style="font-size:13px;background:var(--surface-3);padding:9px 12px;border-radius:8px"></span><button class="btn brand" id="nbCopy">Copy</button><span id="nbWarn"></span></div></div>`;
    $("#areaView").innerHTML=h;
    $$("[data-copy]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();copyText(b.dataset.copy);}));
    $$(".arow[data-act]").forEach(r=>r.addEventListener("click",()=>openActivity(cid,r.dataset.act)));
    $("#newAssess").addEventListener("click",()=>toast("Create assessment — wired in the real build"));
    const upd=()=>{const fs=$("#nbFS").value,fm=$("#nbForm").value,ttl=$("#nbName").value.trim(),ov=$("#nbOut").value,fo=findOutcome(course,ov);const full=`${psModule(fo?fo.mtag:"M1")} | ${psOutcomeCode(course,ov)} | ${fm} | ${fs==="Sum"?"Sub":"Form"} | ${ttl||"…"}`;$("#nbPreview").textContent=full;
      const existing=ACTIVITIES[course].flatMap(a=>a.links.flatMap(l=>l.forms.map(f=>psName(course,a,l.o,f))));

  }

      <div class="o-code" style="color:var(--brand)">${escH(a.type)} · Sprint 0${a.sprint} · ${a.module} · ${a.formSum==='Sum'?'Summative':'Formative'}${a.stage?' · '+escH(a.stage):''}</div>

        <div class="evid-list">${a.links.map(l=>{const fo=findOutcome(cid,l.o);const on=assessedSet(cid,a).has(l.o);return `<label class="evid" style="border-left-color:${on?'var(--accent)':'var(--line)'};cursor:pointer;align-items:center;gap:11px;opacity:${on?1:.62}"><input type="checkbox" class="assessChk" data-o="${l.o}" ${on?"checked":""} style="width:16px;height:16px;flex:none;accent-color:var(--accent)"><div><div style="font-weight:600;font-size:12.5px">${l.o}${fo?' · '+escH(fo.o.title):''}</div><div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap">${l.forms.map(f=>`<span class="fchip ${f}">${f} · ${FORMS[f].name}</span>`).join("")}</div></div></label>`;}).join("")}</div></div>
      <div class="insp-section"><div class="eyebrow">PowerSchool names · ${psAll.length}</div><div class="psnames">${psAll.map(n=>`<div class="psname"><span class="mono">${n}</span><button class="copyMini" data-copy="${n}" aria-label="Copy">${IC.copy}</button></div>`).join("")}</div></div>

  // ── Sprint Planner ──
  function planningAlert(cid){
    for(const o of allOutcomes(cid)){const forms=formsForOutcome(cid,o.o.id),acts=actsForOutcome(cid,o.o.id);if(acts.length&&forms.size===1)return `${o.o.id} (${o.o.title}) has only ${FORMS[[...forms][0]].name} evidence planned — add a second form to strengthen the judgment.`;}
    for(const o of allOutcomes(cid)){if(actsForOutcome(cid,o.o.id).length===0)return `${o.o.id} (${o.o.title}) is in the curriculum but has no activity or evidence opportunity yet.`;}
    return null;
  }
  function weekOf(cid,iso){if(!iso)return 0;const d=(new Date(iso+"T00:00:00")-new Date(termStartOf(cid)+"T00:00:00"))/86400000;return Math.floor(d/7)+1;}
  function weekRangeLabel(cid,n){const s=addDays(termStartOf(cid),(n-1)*7),e=addDays(s,4),f=iso=>new Date(iso+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});return f(s)+" – "+f(e);}
  function sprintWeekSpan(sp){const ns=(String(sp&&sp.weeks||"").match(/\d+/g)||[]).map(Number);return ns.length?[Math.min.apply(null,ns),Math.max.apply(null,ns)]:[(sp&&sp.n)||1,(sp&&sp.n)||1];}
  function sprintForWeek(cid,n){return (SPRINTS[cid]||[]).find(sp=>{const s=sprintWeekSpan(sp);return n>=s[0]&&n<=s[1];});}
  function renderWeekCalendar(cid){
    const byWeek={}; let maxW=1;
    ACTIVITIES[cid].forEach(a=>{const w=Math.max(1,weekOf(cid,activityDue(cid,a)));(byWeek[w]=byWeek[w]||[]).push(a);if(w>maxW)maxW=w;});
    SPRINTS[cid].forEach(sp=>{const b=sprintWeekSpan(sp)[1];if(b>maxW)maxW=b;});
    let h=`<div class="calwrap">`;
    for(let w=1;w<=maxW;w++){
      const list=byWeek[w]||[], sums=list.filter(a=>a.formSum==="Sum").length, heavy=sums>=2||list.length>=5, sp=sprintForWeek(cid,w);
      h+=`<div class="weekrow ${heavy?'heavy':''}"><div class="weekhd"><div class="wn">Week ${w}</div><div class="wd">${weekRangeLabel(cid,w)}</div>${sp?`<div class="wctx">${escH(sp.title)}</div>`:""}<div class="wload">${list.length} assessment${list.length===1?'':'s'}${sums?` · ${sums} summative`:""}</div>${heavy?`<div class="flag-inline warn" style="margin-top:6px">heavy week</div>`:""}</div>`;
      h+= list.length ? `<div class="weekcards">${list.map(a=>{const al=alinks(cid,a),f0=[...new Set(al.flatMap(l=>l.forms))];return `<div class="acal" data-act="${a.id}" style="border-left-color:${a.formSum==='Sum'?'var(--lv4)':'var(--accent)'}"><div class="at2">${a.type} · ${a.formSum==='Sum'?'Sum':'Form'}</div><div class="an2">${escH(a.title)}</div><div style="display:flex;gap:4px;flex-wrap:wrap">${al.slice(0,3).map(l=>`<span class="ochip" style="padding:2px 6px">${l.o}</span>`).join("")}${f0.map(f=>`<span class="fchip ${f}">${f}</span>`).join("")}</div></div>`;}).join("")}</div>` : `<div class="weekempty">— no assessments scheduled —</div>`;
      h+=`</div>`;
    }
    return h+`</div>`;
  }

  // ── Evidence Capture (dynamic rubric by form) ──
  const RUBRICS={
