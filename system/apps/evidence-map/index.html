    Obs:["Works with independence","Shows the process, not just the result","Collaborates where relevant","Responds to feedback","Applies problem-solving behaviour"]
  };
  const QUESTIONS={Con:["Walk me through how this works.","Why this approach over another?","What would break this, and how would you fix it?"]};

  // ── Rubrics · 2+/3+ modifiers · triangulation · proposed mark (vertical-slice engine) ──
  const RUB_LS="tos_rubrics_v1"; let rubricOv={}; try{rubricOv=JSON.parse(window.AppStorage.getItem(RUB_LS)||"{}")||{};}catch(e){}
  const rubKey=(oid,form)=>oid+"|"+form;
  const RUBOUT={"MM12":{"1.1":[{"label":"Image Manipulation Techniques","lv":{"1":"Applies basic image edits randomly without clear technical control or deliberate intent.","2":"Applies standard edits like cropping or simple filters, but choices occasionally obscure detail or lack clear purpose.","3":"Applies specific manipulation techniques deliberately (e.g., color balancing, contrast, layering) to strengthen visual communication (Multimedia 12 Outcomes (2015), p. 3).","4":"Combines advanced manipulation procedures seamlessly to guide viewer focus and craft nuanced visual narrative."}},{"label":"Text and Visual Integration","lv":{"1":"Places text over an image without modifying font, color, or placement, resulting in poor readability.","2":"Integrates text with an image, but font choices or layout partially clash with background visual elements.","3":"Manipulates typography and layout intentionally so text and imagery co-create a unified message for an audience (Multimedia 12 Outcomes (2015), p. 3).","4":"Innovatively synthesizes customized text and manipulated visual media to create a striking, memorable visual impact."}},{"label":"Purpose and Audience Alignment","lv":{"1":"Edits digital images without considering who the viewer is or what message is being conveyed.","2":"Identifies a target audience, but editing decisions only weakly reflect the intended purpose.","3":"Tailors visual editing decisions directly to suit a clearly defined purpose and target audience.","4":"Critically reflects on and adapts visual editing strategies to effectively engage distinct audiences across varied digital media (Multimedia 12 Outcomes (2015), p. 3)."}}],"2.5":[{"label":"Motion communicates emphasis","lv":{"1":"Movement is present, but it distracts from or gives no clear priority to the main idea.","2":"Some motion highlights important content, but emphasis is inconsistent or competes with other elements.","3":"Deliberate changes in position, scale, opacity, or type clearly direct attention to the main idea.","4":"A purposeful motion hierarchy guides attention across several ideas and remains effective in a new audience or format."}},{"label":"Timing and pacing","lv":{"1":"Elements move too quickly, too slowly, or for similar durations, making the message difficult to follow.","2":"Some durations and pauses support understanding, but sections still feel rushed, delayed, or uneven.","3":"Durations, pauses, speed changes, and spacing create an intentional pace that gives viewers enough time to understand.","4":"Timing shifts strategically to build anticipation, contrast, or rhythm while preserving clarity throughout."}},{"label":"Communication of a concept","lv":{"1":"The viewer cannot determine the intended concept from the motion graphic alone.","2":"The concept is partly understandable, but some movements or transitions do not support it.","3":"Motion, sequencing, and transitions work together to communicate one clear concept to the intended audience.","4":"The same concept is adapted effectively for a different audience, context, or purpose using revised motion choices (Multimedia 12 Outcomes, 2015, p. 4)."}},{"label":"Testing and revision","lv":{"1":"The first version is submitted without checking whether viewers understand the emphasis or pacing.","2":"Feedback identifies timing or emphasis problems, but revisions address only some of them.","3":"Viewer feedback is used to revise specific timing, pacing, or emphasis choices and improve clarity.","4":"Multiple versions are compared using audience evidence, and the strongest motion choices are justified for a relevant real-world context (Multimedia 12 Outcomes (2015), p. 4)."}}],"1.2":[{"label":"Analysis of form, content, and impact","lv":{"1":"Names image features or subject matter but does not connect them to cultural, historical, or emotional impact.","2":"Explains how at least one feature or content choice affects emotion or meaning, with limited attention to context.","3":"Uses specific evidence from form and content to explain the image’s cultural, historical, and emotional impact.","4":"Compares plausible interpretations across contexts or audiences and explains how form and content produce those differences."}},{"label":"Purposeful image manipulation","lv":{"1":"Makes edits that appear arbitrary or leave the intended message unclear.","2":"Uses one relevant edit to support a message, but some choices weaken or distract from the purpose.","3":"Uses coordinated editing choices—such as crop, colour, contrast, scale, or compositing—to communicate a clear meaning to an intended audience.","4":"Adapts editing choices effectively for a new audience, platform, or cultural context while preserving a deliberate message."}},{"label":"Audience, context, and responsible use","lv":{"1":"Treats the image as having one fixed meaning and overlooks its source or represented people.","2":"Identifies an intended audience or contextual concern but explains its effect only generally.","3":"Explains how audience and context influence interpretation and edits without misleading viewers about people, events, or source meaning.","4":"Anticipates conflicting audience responses and revises the image to communicate responsibly across contexts (Multimedia 12 Outcomes (2015), pp. 3–4)."}},{"label":"Reflection and justification","lv":{"1":"Describes what was changed without explaining why.","2":"Gives a general reason for some edits and identifies one effect on the viewer.","3":"Justifies each major edit by linking it to purpose, audience, and a specific change in meaning or emotion.","4":"Evaluates unintended interpretations, compares alternatives, and uses that analysis to refine or defend the final image."}}],"1.3":[{"label":"Production procedure","lv":{"1":"Uses tools without a clear sequence and needs help to produce a usable image.","2":"Completes some planning, editing, exporting, and review steps, but misses or misorders important steps.","3":"Independently plans, sources or captures, edits, exports, and reviews images using an appropriate sequence.","4":"Adapts and documents the production sequence efficiently for different media, constraints, or audiences."}},{"label":"Editing to communicate meaning","lv":{"1":"Makes edits that are mostly accidental, decorative, or unrelated to the intended message.","2":"Uses some relevant edits, but their effect on audience attention or interpretation is inconsistent.","3":"Deliberately uses composition, cropping, colour, contrast, scale, or layering to communicate a clear meaning to the intended audience.","4":"Combines and refines edits to create a nuanced message, then transfers those choices effectively to a new audience or purpose."}},{"label":"Technical preparation for media","lv":{"1":"Exports with unsuitable size, resolution, format, or compression, reducing usability or image quality.","2":"Selects some suitable export settings but needs support to balance quality, file size, and medium requirements.","3":"Chooses suitable dimensions, resolution, format, colour settings, and compression for more than one digital or electronic medium.","4":"Tests alternatives and justifies optimized technical settings across multiple media while preserving the intended visual effect."}},{"label":"Reflection and revision","lv":{"1":"Describes what was changed but not how the changes affect meaning, audience, or purpose.","2":"Identifies an intended effect and makes a limited revision based on feedback or comparison.","3":"Explains how specific production and editing choices support audience, purpose, and meaning, then makes a purposeful revision.","4":"Uses evidence from audience response or media testing to evaluate trade-offs and make precise revisions (Multimedia 12 Outcomes (2015), pp. 3–4)."}}],"1.4":[{"label":"Purpose and audience","lv":{"1":"The image has no clear message or shows little awareness of who will view it.","2":"A message and audience are identifiable, but some editing choices distract from or weaken the purpose.","3":"Cropping, composition, colour, and other editing choices consistently communicate a clear message to the intended audience.","4":"The image uses subtle or layered visual choices to communicate effectively across contexts or prompt a deliberate audience response."}},{"label":"Application of art and design principles","lv":{"1":"Elements are placed or styled without clear attention to emphasis, balance, contrast, hierarchy, or unity.","2":"At least one design principle is visible, but the composition is uneven or the focal point is unclear.","3":"Multiple design principles work together to create a balanced, unified composition with a clear focal point (Multimedia 12 Outcomes (2015), pp. 3–4).","4":"Design principles are adapted, combined, or intentionally broken to strengthen meaning while preserving visual coherence."}},{"label":"Image manipulation and technical control","lv":{"1":"Edits are minimal or create visible problems such as rough selections, distortion, inconsistent lighting, or unreadable details.","2":"Several edits are completed, but visible seams, uneven adjustments, or inconsistent resolution reduce their effectiveness.","3":"Cropping, selections, layers, transformations, and tonal or colour adjustments are controlled and suitable for the intended multimedia use (Multimedia 12 Outcomes (2015), p.3).","4":"Advanced or non-obvious manipulation techniques are transferred to a new visual challenge while maintaining precise, believable, or intentionally stylized results."}},{"label":"Communication of meaning","lv":{"1":"Visual choices appear decorative or unrelated to the intended idea.","2":"Some choices support the idea, but the image requires explanation for the viewer to understand it.","3":"The organized use of imagery, composition, and media choices makes the intended meaning understandable without added explanation (Multimedia 12 Outcomes (2015), pp. 3–4).","4":"The image communicates both an immediate message and a deeper interpretation through purposeful visual symbolism, contrast, or juxtaposition."}}],"1.5":[{"label":"Communication of idea","lv":{"1":"The image's main idea is unclear or must be explained verbally.","2":"The image suggests an idea, but some visual choices distract from or weaken it.","3":"The image clearly communicates the intended idea through purposeful visual choices.","4":"The image communicates a layered or nuanced idea that viewers can interpret from deliberately chosen visual details."}},{"label":"Image manipulation","lv":{"1":"Edits are minimal, unfinished, or unrelated to the intended meaning.","2":"Some edits support the meaning, but others appear accidental or inconsistent.","3":"Cropping, composition, colour, contrast, layering, or effects are controlled and deliberately support the meaning.","4":"Multiple editing techniques work together seamlessly to strengthen meaning or create a purposeful new interpretation."}},{"label":"Audience and purpose","lv":{"1":"The image shows little awareness of who will view it or why.","2":"The image partly suits the audience or purpose, but key choices are mismatched.","3":"Content, style, tone, and format suit the identified audience and purpose (Multimedia 12 Outcomes (2015), p. 4).","4":"The image anticipates audience response and adapts visual conventions strategically for a new context or audience."}},{"label":"Visual organization and reflection","lv":{"1":"The image is difficult to follow, and the student cannot connect editing choices to meaning.","2":"The image has some organization, and the student identifies choices without clearly explaining their effects.","3":"The image is coherent and uses media to support understanding; the student explains how specific choices affect meaning (Multimedia 12 Outcomes (2015), pp. 3–4).","4":"The student evaluates audience impact with evidence and identifies precise revisions or transferable strategies (Multimedia 12 Outcomes (2015), p. 4)."}}],"2.1":[{"label":"Timing and pacing","lv":{"1":"Motion uses mostly default timing and feels rushed, slow, or uneven.","2":"Some durations and pauses are adjusted, but the pace is inconsistent or weakens the message.","3":"Durations, pauses, and sequencing create a clear, intentional pace that supports the message.","4":"Timing shifts purposefully for different moments or audiences while maintaining a coherent rhythm."}},{"label":"Emphasis through motion","lv":{"1":"Movement distracts from the message or gives all elements equal attention.","2":"One important element is emphasized, but competing motion sometimes confuses the viewing order.","3":"Position, scale, rotation, or opacity changes clearly guide attention to the intended focal points.","4":"Multiple motion techniques establish a deliberate visual hierarchy without overwhelming the viewer."}},{"label":"Motion procedures and refinement","lv":{"1":"Keyframes or effects are incomplete, disorganized, or produce visible errors.","2":"The animation functions, but abrupt changes, collisions, or unintended gaps remain.","3":"Keyframes, easing, layers, and transitions are applied correctly; previewing and revision produce smooth motion.","4":"Techniques are adapted or combined to solve a new motion-communication challenge, with an efficient organized workflow."}}],"2.2":[{"label":"Analysis of timing, pacing, and emphasis","lv":{"1":"Names a motion feature but does not explain its effect.","2":"Explains one timing or pacing choice with a general effect on the viewer.","3":"Uses specific moments to explain how multiple motion choices control pacing and direct emphasis.","4":"Compares alternative motion choices and predicts how they would change emphasis, pacing, or interpretation."}},{"label":"Relationship between form, content, and emotion","lv":{"1":"Describes what happens without connecting motion form to meaning or emotion.","2":"Makes a partly supported connection between one motion choice and the content or emotional effect.","3":"Explains with evidence how motion form and content work together to create a particular emotional impact.","4":"Explains how the same formal choice could affect different audiences or contexts differently."}},{"label":"Cultural and historical interpretation","lv":{"1":"Makes an unsupported claim about culture or history.","2":"Identifies relevant cultural or historical context but connects it loosely to the motion graphic.","3":"Uses specific evidence to explain how cultural or historical context shapes the work’s form, content, and impact.","4":"Compares contexts or perspectives and explains how they produce different readings of the work."}},{"label":"Transfer to purposeful motion","lv":{"1":"Uses movement without a clear relationship to emphasis or pacing.","2":"Uses a timing or pacing technique inconsistently or with limited purpose.","3":"Applies timing, pacing, and emphasis deliberately so viewers notice and feel what was intended.","4":"Adapts analyzed techniques in an original way and justifies how the choices suit the message and audience."}}],"2.3":[{"label":"Production procedure","lv":{"1":"Starts animating without a clear plan and omits several production stages.","2":"Uses a basic plan and completes most stages, but previews or revisions are limited.","3":"Documents and follows a complete plan-create-preview-revise-export-test process.","4":"Adapts the process efficiently when the audience, format, or medium changes."}},{"label":"Timing and pacing","lv":{"1":"Uses mostly uniform or accidental timing that makes the sequence difficult to follow.","2":"Adjusts some durations or speeds, but pacing is uneven or only partly supports the message.","3":"Controls duration, speed, sequence, and pauses to create clear, purposeful pacing.","4":"Varies timing precisely to build rhythm, anticipation, or contrast across different contexts."}},{"label":"Emphasis through motion","lv":{"1":"Motion distracts from the message or leaves the main idea unclear.","2":"Some motion draws attention, but competing movement weakens the intended emphasis.","3":"Uses motion deliberately to direct attention to the most important information.","4":"Combines motion, stillness, hierarchy, and transitions to shift emphasis with precision."}},{"label":"Media application and reflection","lv":{"1":"Exports one version without checking whether it plays correctly or suits its medium.","2":"Tests one output and identifies a general strength or problem.","3":"Tests the motion graphic in multiple digital or electronic media and explains relevant revisions, reflecting the course focus on suitable time-based images (Multimedia 12 Outcomes (2015), p.3).","4":"Transfers the work to a new medium, revising timing, format, and presentation while explaining the trade-offs."}}],"2.4":[{"label":"Motion creates emphasis","lv":{"1":"Movement is absent, arbitrary, or competes with the main message, so the intended focus is unclear.","2":"Some animation draws attention to important content, but emphasis is inconsistent or occasionally distracting.","3":"Deliberate changes in position, scale, opacity, or colour consistently direct attention to the intended message.","4":"Motion establishes a layered visual hierarchy and shifts emphasis purposefully as the message develops."}},{"label":"Timing and pacing","lv":{"1":"Elements move or remain onscreen for unsuitable lengths, making the sequence rushed, slow, or difficult to follow.","2":"Most content can be followed, but some movements, pauses, or transitions interrupt the rhythm.","3":"Durations, pauses, speeds, and transitions create a clear rhythm and give viewers appropriate time to process each idea.","4":"Timing varies strategically to build anticipation, contrast, or emotional impact while preserving clarity."}},{"label":"Application of art and design principles","lv":{"1":"Motion, layout, colour, contrast, and alignment do not work together, reducing readability or coherence.","2":"Some design choices support the animation, but inconsistent contrast, alignment, balance, or repetition weakens the result.","3":"Motion works with contrast, alignment, balance, repetition, and visual hierarchy to create a clear, unified graphic.","4":"Design principles are adapted confidently across multiple scenes or formats while maintaining a distinctive and coherent visual language."}},{"label":"Revision for pacing and flow","lv":{"1":"The sequence shows no clear evidence of previewing or revision; distracting or abrupt moments remain.","2":"The sequence has been previewed and some problems corrected, but noticeable pacing or transition issues remain.","3":"Preview feedback is used to refine cuts, transitions, and movement into a complete sequence with controlled pacing and flow.","4":"Revisions compare alternatives or viewer responses and deliberately reshape the sequence for a different audience, mood, or communication context."}}]},"COM11":{"1.1":[{"label":"Chronology of communication technology","lv":{"1":"Places few technologies in order and includes major sequencing errors.","2":"Places several technologies in order but has minor gaps or errors.","3":"Accurately traces a clear sequence of major communication technologies over time.","4":"Connects the sequence to broader patterns, such as increasing speed, reach, or access."}},{"label":"Understanding communication media","lv":{"1":"Names technologies without explaining how they carried messages.","2":"Describes how some technologies carried messages but gives limited comparison.","3":"Explains how different media enabled people to create, transmit, and receive messages.","4":"Applies this understanding to explain how the strengths and limits of a medium shaped communication."}},{"label":"Social significance of technological shifts","lv":{"1":"Makes vague claims about why communication technologies mattered.","2":"Identifies a social effect but provides limited explanation or evidence.","3":"Explains specific ways changes in communication technology affected society.","4":"Analyzes how one technological shift created benefits, limitations, or unequal effects for different groups."}}],"1.2":[{"label":"Identifying strengths and interests","lv":{"1":"Names a general strength or interest without showing how it relates to communications technology.","2":"Identifies relevant strengths and interests but explains some connections only broadly.","3":"Identifies specific strengths and interests and clearly explains how they relate to communications technology work.","4":"Compares how the same strengths and interests could be useful across different communications technology roles."}},{"label":"Investigating career options","lv":{"1":"Names a communications technology career with little or inaccurate detail about the work.","2":"Describes basic responsibilities or skills for at least one communications technology career.","3":"Investigates multiple communications technology careers and accurately describes their responsibilities, skills, and industry context.","4":"Compares multiple careers and uses the comparison to identify promising options or next steps."}},{"label":"Using evidence of career fit","lv":{"1":"Chooses a career without evidence from personal experience or work.","2":"Gives a personal example but only partly connects it to the chosen career.","3":"Uses specific evidence from experiences, interests, or portfolio work to justify a suitable career option.","4":"Uses multiple pieces of evidence to evaluate career fit, identify a growth area, and suggest how to strengthen a future portfolio."}}],"1.3":[{"label":"Curation of course work","lv":{"1":"Includes few course pieces, with little evidence of selection or organization.","2":"Includes several course pieces, but the collection shows limited range or uneven organization.","3":"Selects and organizes a purposeful collection that represents the range and quality of work completed throughout the course.","4":"Curates a focused collection for a professional audience, using sequencing and selection to communicate distinctive strengths and growth."}},{"label":"Documentation of the design process","lv":{"1":"Shows finished work with little or no evidence of how it was developed.","2":"Shows some planning or revisions, but stages of the design process are incomplete or unclear.","3":"Documents the design process for selected work through clear evidence of planning, development, feedback, revision, and completion.","4":"Connects design-process evidence across projects to show how earlier learning informed later decisions and improvements."}},{"label":"Reflection","lv":{"1":"Describes what was made without explaining decisions or learning.","2":"Explains some decisions, challenges, feedback, revisions, or learning, but reflections lack detail.","3":"Reflects clearly on design choices, challenges, feedback, revisions, results, and learning for selected work.","4":"Evaluates patterns across the portfolio and identifies specific ways to transfer learning to future communications technology work."}},{"label":"Professional portfolio presentation","lv":{"1":"Presents work with inconsistent structure, labels, or formatting that makes the portfolio difficult to follow.","2":"Uses a recognizable structure, but navigation, labels, image quality, or formatting are inconsistent.","3":"Presents a coherent, polished portfolio with consistent design, clear navigation, readable text, effective visuals, and complete project information.","4":"Adapts the portfolio's structure, visual identity, and supporting information to communicate effectively with a chosen professional audience."}}],"1.4":[{"label":"Design problem and audience","lv":{"1":"Names a product to make but does not clearly identify the communication problem or audience.","2":"Identifies the problem and a broad audience, but the audience's needs or intended response remain unclear.","3":"Defines the communication problem, specific audience, purpose, and intended audience response before creating.","4":"Uses audience insights or feedback to refine the problem and address differing needs within the audience."}},{"label":"Message and purpose","lv":{"1":"Presents disconnected content with no clear persuasive or entertainment message.","2":"Communicates a recognizable message, but some choices distract from or weaken its purpose.","3":"Creates a focused message whose content and presentation clearly persuade or entertain the intended audience.","4":"Shapes the message strategically to sustain attention and produce a deliberate emotional or behavioural response."}},{"label":"Use of electronic communication tools","lv":{"1":"Uses a tool's basic features without showing how they support the message or audience.","2":"Uses relevant features in one or more tools, though some choices do not fit the audience or purpose.","3":"Combines appropriate electronic tools and features to deliver an effective solution for the audience and purpose.","4":"Adapts or combines tools in an original, purposeful way that strengthens the solution across formats or contexts."}},{"label":"Testing and revision","lv":{"1":"Submits the first version without checking its effect on the intended audience.","2":"Makes surface changes after limited feedback, with little improvement to the message's effect.","3":"Tests the solution with the intended audience and revises specific design choices to improve persuasion or entertainment.","4":"Uses evidence from multiple audience responses to justify revisions and improve the solution beyond its original context."}}],"1.5":[{"label":"Social impact analysis","lv":{"1":"Identifies a vague or one-sided social effect with little explanation.","2":"Describes at least one social benefit and one harm, but connections to people or communities are incomplete.","3":"Explains specific benefits and harms for different people or communities and shows how the technology causes them.","4":"Compares how impacts differ across groups or contexts and anticipates unintended social consequences."}},{"label":"Environmental impact analysis","lv":{"1":"Names an environmental issue without connecting it clearly to communications technology.","2":"Describes one or two impacts, such as energy use or electronic waste, with limited life-cycle detail.","3":"Explains impacts from at least two life-cycle stages, such as resource extraction, production, use, and disposal.","4":"Connects impacts across the full life cycle and identifies trade-offs or ways one solution may shift harm elsewhere."}},{"label":"Ethical weighing and judgment","lv":{"1":"States an unsupported opinion or considers only one type of impact.","2":"Considers social and environmental effects but gives limited reasons for the judgment.","3":"Weighs social benefits, social harms, and environmental costs to reach a clearly justified ethical judgment.","4":"Applies consistent ethical reasoning to a new communications technology or challenges a judgment by considering competing values."}},{"label":"Sustainable recommendation","lv":{"1":"Suggests a general action that is not clearly linked to the identified impacts.","2":"Proposes a relevant action but does not explain its likely effect or limitations.","3":"Recommends a specific design, use, purchasing, repair, reuse, or disposal action and explains how it reduces identified harm.","4":"Adapts the recommendation for different stakeholders and evaluates possible limitations or unintended effects."}}],"1.6":[{"label":"Life-cycle analysis","lv":{"1":"Names one or two stages in the life of communications equipment.","2":"Describes several stages but leaves gaps or treats them as separate events.","3":"Accurately analyzes the full life cycle from material extraction through manufacturing, use, and end-of-life.","4":"Compares alternative life-cycle pathways and explains how decisions at one stage affect later stages."}},{"label":"Resources and impacts","lv":{"1":"Identifies a resource or environmental impact with little connection to a life-cycle stage.","2":"Links some resources and impacts to appropriate stages, with limited explanation.","3":"Explains how resources are used and environmental impacts arise across multiple life-cycle stages.","4":"Evaluates trade-offs among materials, energy use, equipment lifespan, and environmental impact."}},{"label":"E-waste and responsible end-of-life choices","lv":{"1":"Recognizes that discarded communications equipment becomes e-waste.","2":"Describes reuse, recycling, or disposal options but gives limited reasons for choosing them.","3":"Explains e-waste concerns and recommends appropriate repair, reuse, recycling, or disposal actions.","4":"Applies life-cycle evidence to justify an end-of-life strategy that recovers resources and reduces harm."}}],"1.7":[{"label":"Hazard identification","lv":{"1":"Begins work without checking and overlooks obvious hazards.","2":"Identifies some hazards when prompted but misses others or cannot explain the risk.","3":"Independently checks the equipment and workspace, identifies hazards, and addresses or reports them before use.","4":"Anticipates less-obvious hazards in unfamiliar situations and helps others prevent them."}},{"label":"Following safety procedures","lv":{"1":"Uses equipment without consistently following required safety steps.","2":"Follows basic procedures with reminders or in familiar tasks only.","3":"Independently follows the correct procedure while setting up, operating, moving, and shutting down equipment.","4":"Adapts safe procedures appropriately to new tools or situations and explains the reasons for each step."}},{"label":"Responding to unsafe conditions","lv":{"1":"Continues working or handles a problem without reporting it.","2":"Stops or reports a problem after prompting but does not fully secure the equipment or area.","3":"Stops work, prevents further use when needed, and promptly reports damage, hazards, or incidents.","4":"Responds calmly to unfamiliar hazards, protects others from the risk, and recommends a practical prevention step."}},{"label":"Equipment care","lv":{"1":"Handles or stores equipment in ways that risk damage or injury.","2":"Uses basic care practices inconsistently or with reminders.","3":"Handles, cleans, transports, and stores equipment according to the required procedure.","4":"Applies appropriate care to unfamiliar equipment and improves setup or storage practices to reduce future damage."}}],"2.1":[{"label":"Basic camera operation","lv":{"1":"Uses the camera only with step-by-step help and may handle or operate it incorrectly.","2":"Uses basic controls and captures an image with occasional prompts.","3":"Independently handles, focuses, and operates the camera correctly to capture a clear image.","4":"Confidently adapts camera operation to different shooting situations and helps troubleshoot basic problems."}},{"label":"Exposure and ISO","lv":{"1":"Does not yet connect exposure or ISO settings to image brightness and clarity.","2":"Adjusts exposure or ISO with guidance but results are inconsistent.","3":"Selects and adjusts exposure and ISO to produce a suitably bright, clear image.","4":"Purposefully balances exposure and ISO across changing light conditions and explains the trade-offs."}},{"label":"Camera and lens care","lv":{"1":"Needs frequent reminders to protect the camera and avoid touching or damaging the lens.","2":"Follows some care routines but needs prompts when cleaning, carrying, or storing equipment.","3":"Independently carries, cleans, protects, and stores the camera and lens correctly.","4":"Consistently applies safe care routines and anticipates risks before using or storing the equipment."}}],"2.2":[{"label":"SLR and tripod technique","lv":{"1":"Uses the SLR or tripod incorrectly, resulting in unsteady or unintended photographs.","2":"Uses the SLR and tripod with some control, but setup or technique is inconsistent.","3":"Uses the SLR and tripod correctly to create steady, deliberate photographs.","4":"Adapts SLR and tripod use confidently to achieve deliberate results in varied shooting situations."}},{"label":"Rule of thirds","lv":{"1":"Places subjects without clear attention to the rule of thirds.","2":"Attempts the rule of thirds, but subject placement does not consistently strengthen the image.","3":"Uses the rule of thirds purposefully to create a clear, well-balanced composition.","4":"Uses or intentionally departs from the rule of thirds to control emphasis and viewer attention."}},{"label":"Composition choices","lv":{"1":"Uses one obvious viewpoint or framing choice without considering distracting or unnecessary elements.","2":"Tries different viewpoints or framing choices, with mixed success in directing attention.","3":"Uses viewpoint, framing, and subject placement deliberately to produce clear, well-framed photographs.","4":"Combines and varies composition techniques to create distinctive photographs suited to different subjects."}}],"2.3":[{"label":"Exploration of lighting techniques","lv":{"1":"Uses one lighting setup without intentionally changing the light direction.","2":"Tries more than one light direction, but the differences between photographs are limited or accidental.","3":"Photographs the same scene with multiple intentional light directions, including natural light.","4":"Transfers the techniques to a new scene and adapts light direction to create distinct effects."}},{"label":"Control of clarity","lv":{"1":"Lighting hides important details or makes the subject difficult to see.","2":"Some subject details are clear, but distracting shadows or bright areas remain.","3":"Chooses and adjusts the lighting so the main subject and important details are clear.","4":"Controls which details are revealed or concealed to guide the viewer’s attention."}},{"label":"Use of lighting to shape mood","lv":{"1":"The photograph’s lighting does not show an intentional mood.","2":"Attempts a mood, but the lighting direction and resulting effect do not consistently support it.","3":"Selects a lighting direction whose shadows, highlights, and contrast clearly support an intended mood.","4":"Uses lighting choices in a new scene to create a deliberate, nuanced mood while maintaining needed clarity."}}],"2.4":[{"label":"Understanding resolution and pixels","lv":{"1":"Identifies pixels or resolution only with support.","2":"Reads pixel dimensions but gives a partly accurate explanation of resolution.","3":"Accurately explains resolution using pixels and relates it to image detail.","4":"Predicts how changing pixel dimensions will affect detail and suitability across different outputs."}},{"label":"Choosing resolution","lv":{"1":"Chooses a resolution without considering the intended output.","2":"Chooses a workable resolution but gives limited justification.","3":"Chooses an appropriate resolution for a given screen or print output and justifies the choice.","4":"Adapts resolution choices across multiple outputs while balancing image detail and file size."}},{"label":"Choosing file format and compression","lv":{"1":"Chooses a file format or compression setting without linking it to the output.","2":"Chooses a partly suitable format and recognizes that compression changes file size or quality.","3":"Chooses a suitable file format and compression level for the output, explaining the effect on quality and file size.","4":"Compares format and compression options, then selects the best trade-off for different output requirements."}}],"4.1":[{"label":"Purposeful use of design elements","lv":{"1":"Uses elements without a clear connection to the intended message.","2":"Chooses some relevant elements, but their use is inconsistent or partly supports the message.","3":"Selects and controls relevant elements so the image communicates its intended message clearly.","4":"Adapts and combines elements in original ways to communicate effectively for different purposes or viewers."}},{"label":"Application of design principles","lv":{"1":"Arranges content with little evidence of contrast, balance, emphasis, repetition, alignment, or proximity.","2":"Applies some principles, but the composition has distracting, crowded, or disconnected areas.","3":"Applies appropriate principles consistently to create a balanced, coherent composition.","4":"Combines and deliberately bends principles to strengthen meaning or create a distinctive visual effect."}},{"label":"Composition and visual hierarchy","lv":{"1":"Provides no clear focal point or viewing order; important content is difficult to identify.","2":"Creates a focal point, but size, placement, spacing, or contrast does not consistently guide the viewer.","3":"Uses size, placement, spacing, and contrast to establish a clear focal point and viewing order.","4":"Builds a layered visual hierarchy that guides attention strategically while maintaining clarity across the whole composition."}},{"label":"Explanation and revision of design choices","lv":{"1":"Names few design choices and makes revisions that do not address communication problems.","2":"Identifies some choices and makes basic revisions, with limited explanation of their effects.","3":"Explains how specific elements and principles affect communication and revises the image to improve clarity.","4":"Evaluates design choices from multiple viewer perspectives and makes targeted revisions that strengthen both message and impact."}}],"4.2":[{"label":"Colour-wheel understanding","lv":{"1":"Identifies colours but does not correctly show complementary or analogous relationships.","2":"Identifies a complementary or analogous relationship with some errors or prompting.","3":"Correctly identifies and uses complementary and analogous relationships on the colour wheel.","4":"Accurately compares both relationships and selects the more effective one for a new design purpose."}},{"label":"Palette choice","lv":{"1":"Chooses colours without a clear connection to the intended mood or meaning.","2":"Chooses a partly suitable palette, but some colours weaken the intended mood or meaning.","3":"Chooses a complementary or analogous palette that clearly supports the intended mood and meaning.","4":"Refines or adapts the palette to create a deliberate, nuanced effect for a different audience or message."}},{"label":"Application in graphic design","lv":{"1":"Uses colours inconsistently, so the design lacks a clear palette.","2":"Mostly follows the chosen palette, but inconsistent colour choices reduce its effect.","3":"Applies the chosen palette consistently so important elements and the overall message are clear.","4":"Uses the palette strategically to guide attention and successfully transfers the approach to a new graphic design."}},{"label":"Design justification","lv":{"1":"Names colours used but does not connect them to the colour wheel, mood, or meaning.","2":"Gives a general reason for the palette with a partial connection to colour-wheel relationships.","3":"Explains how the chosen colour-wheel relationship creates the intended mood and meaning.","4":"Evaluates the palette's effect and justifies specific changes for a different mood, meaning, or context."}}],"4.3":[{"label":"Typeface choice","lv":{"1":"Chooses a typeface that conflicts with the message or is difficult to read.","2":"Chooses a mostly readable typeface, but its connection to the message is unclear or inconsistent.","3":"Chooses a readable typeface that clearly reinforces the message and purpose.","4":"Combines or adapts typefaces purposefully to strengthen the message across different design contexts."}},{"label":"Visual hierarchy","lv":{"1":"Presents text with little distinction, so the reading order is unclear.","2":"Uses some differences in size, weight, or placement, but the reading order is inconsistent.","3":"Uses size, weight, spacing, and placement to create a clear and intentional reading order.","4":"Creates a refined hierarchy that guides attention effectively even when the content or layout becomes more complex."}},{"label":"Legibility and type setting","lv":{"1":"Uses sizing, spacing, alignment, or contrast that makes important text difficult to read.","2":"Keeps most text readable, but some type-setting choices reduce clarity.","3":"Sets type with appropriate size, spacing, alignment, and contrast so all text is easy to read.","4":"Adjusts type setting effectively for different formats, viewing distances, or amounts of text while preserving clarity."}}],"4.4":[{"label":"Image manipulation","lv":{"1":"Images are mostly unedited or altered in ways that distract from the intended message.","2":"Images are cropped, resized, or adjusted, but some choices only partly support the message.","3":"Images are deliberately selected and manipulated to focus attention and clearly support the message.","4":"Image manipulation changes meaning or emphasis in a purposeful, original way that strengthens the message for the audience."}},{"label":"Use of layers","lv":{"1":"Images and words are difficult to edit because layers are missing, unclear, or poorly arranged.","2":"Most elements are on separate layers, though the layer order or organization causes some layout problems.","3":"Images and words are placed on separate, logically ordered layers that allow precise editing and arrangement.","4":"Layers are named, grouped, and used strategically to create a polished composition that can be efficiently revised."}},{"label":"Clarity of message","lv":{"1":"The combination of images and words does not communicate a recognizable message.","2":"A message is present, but competing images, wording, or layout make it partly unclear.","3":"Images and words work together so the intended message is clear and immediately understandable.","4":"Images and words create added meaning together, communicating a memorable message with deliberate emphasis or nuance."}},{"label":"Fit for audience","lv":{"1":"The design shows little evidence of considering who will view it.","2":"Some choices suit the audience, but the wording, imagery, or visual style is inconsistent.","3":"Wording, imagery, colour, scale, and layout are appropriate for the intended audience.","4":"Design choices anticipate the audience’s interests and likely response, adapting the message for stronger impact."}}],"4.5":[{"label":"Image size and resolution","lv":{"1":"Exports an image with dimensions or resolution that do not suit its intended web use.","2":"Adjusts dimensions or resolution, but the image remains unnecessarily large or visibly unsuitable.","3":"Exports the image at dimensions and resolution appropriate for its intended web use.","4":"Adapts dimensions and resolution effectively for different web placements or screen needs."}},{"label":"File format","lv":{"1":"Uses a file format without considering whether it suits the image or web use.","2":"Chooses a web-suitable format but cannot consistently match it to the image's needs.","3":"Selects a web-suitable file format that matches the image and intended use.","4":"Compares format options and selects the best one for differing web requirements."}},{"label":"Compression and quality","lv":{"1":"Exports without adjusting compression, producing an unnecessarily large or visibly poor image.","2":"Adjusts compression, but the balance between file size and visual quality is inconsistent.","3":"Uses compression that reduces file size while preserving acceptable visual quality.","4":"Fine-tunes compression for different web uses and explains the trade-off between file size and image quality."}}],"6.1":[{"label":"Safe camera and tripod setup","lv":{"1":"Handles or mounts the camera unsafely, or leaves the tripod unstable.","2":"Mounts the camera and adjusts the tripod with reminders, but the setup may be uneven or insecure.","3":"Mounts, secures, levels, and uses the camera and tripod safely without reminders.","4":"Adapts the safe setup confidently for a different shot while keeping the camera secure and stable."}},{"label":"Stable, usable footage","lv":{"1":"Records footage with frequent shake, accidental movement, or unusable framing.","2":"Records a recognizable shot, but some shake, drift, or framing problems remain.","3":"Records clean, stable, intentionally framed footage that is ready to use.","4":"Maintains clean, stable framing while changing shot position or composition for a new purpose."}},{"label":"Green-screen plate capture","lv":{"1":"Records a plate with missing green areas, unwanted objects, or movement that prevents a clean chroma key.","2":"Records a mostly usable plate, but uneven framing or visible obstructions make chroma keying difficult.","3":"Records a stable plate with the subject or scene framed against a clear green background, ready for chroma keying.","4":"Captures multiple consistent plates or adjusts framing to support different placements in a virtual world."}}],"6.2":[{"label":"Soundtrack choices","lv":{"1":"Uses few sounds, or sounds that do not match the scene’s setting and action.","2":"Uses some suitable sounds, but missing or mismatched layers weaken the scene’s realism.","3":"Combines suitable dialogue, ambience, music, and/or foley to make the composited scene feel real.","4":"Designs original or carefully shaped sound layers that strengthen realism, mood, and spatial depth across the scene."}},{"label":"Synchronization","lv":{"1":"Sound cues are noticeably disconnected from visible actions or scene changes.","2":"Some cues align, but several begin, end, or peak too early or late.","3":"Syncs key foley, dialogue, and soundtrack cues accurately with visible actions and scene changes.","4":"Uses precise, purposeful timing—including anticipation, impact, and decay—to enhance actions and transitions."}},{"label":"Mix and clarity","lv":{"1":"Levels are uneven, important sounds are difficult to hear, or tracks clip or overpower one another.","2":"Most sounds are audible, but competing levels or abrupt changes sometimes distract from the scene.","3":"Balances soundtrack layers so important sounds remain clear, levels are controlled, and transitions are smooth.","4":"Uses purposeful level changes, fades, and sound placement to guide attention while preserving clarity throughout."}}],"6.3":[{"label":"Keying","lv":{"1":"Large areas of the original background remain or parts of the subject disappear.","2":"The background is removed, but visible spill, holes, or unstable edges distract from the shot.","3":"The background is removed consistently with clean subject edges and minimal spill.","4":"Fine details and difficult edges remain natural across changing movement or lighting."}},{"label":"Compositing in the virtual set","lv":{"1":"The live footage appears placed on top of the virtual set without matching the scene.","2":"Placement is generally suitable, but scale, perspective, or overlap is inconsistent.","3":"Scale, position, perspective, and layer order make the live footage fit the virtual set.","4":"Depth, shadows, reflections, or atmospheric effects are added convincingly to strengthen the integration."}},{"label":"Match-move","lv":{"1":"Live footage and the virtual environment move independently or drift apart.","2":"Movement aligns in simple sections but slips, jitters, or loses alignment elsewhere.","3":"Tracked movement keeps the subject and virtual environment aligned throughout the shot.","4":"Tracking remains convincing through complex motion, perspective change, or partial obstruction."}},{"label":"Shot integration","lv":{"1":"Differences in colour, lighting, sharpness, or timing make the elements clearly separate.","2":"Some visual adjustments are made, but noticeable mismatches remain.","3":"Colour, lighting, edges, sharpness, and timing are adjusted so the composite reads as one shot.","4":"The same integration choices are adapted deliberately to create a convincing new shot or visual style."}}],"6.4":[{"label":"Codec and export settings","lv":{"1":"Exports with an unsuitable codec or settings that prevent reliable playback.","2":"Uses a workable codec but needs help choosing appropriate export settings.","3":"Chooses a suitable codec and export settings for electronic distribution.","4":"Adapts codec and export settings effectively for different electronic distribution needs."}},{"label":"Bitrate, compression, and file size","lv":{"1":"Uses compression settings that create an impractical file size or seriously damage quality.","2":"Adjusts bitrate or compression but produces an uneven balance between quality and size.","3":"Sets bitrate and compression to produce an appropriate balance of quality and file size.","4":"Compares exports and fine-tunes bitrate and compression to improve efficiency without noticeable quality loss."}},{"label":"Render and playback quality","lv":{"1":"Renders an incomplete or unplayable video with major visible or audio problems.","2":"Renders a playable video but leaves noticeable quality or completeness issues.","3":"Renders a complete video that plays correctly with acceptable picture and sound quality.","4":"Checks the render across playback conditions and corrects issues before delivery."}},{"label":"Electronic delivery","lv":{"1":"Produces a file that is not ready to distribute electronically.","2":"Produces a distributable file but needs help confirming its size, format, or playback.","3":"Delivers a correctly named, playable file at an appropriate quality and size.","4":"Prepares optimized versions for different electronic distribution requirements."}}],"7.1":[{"label":"Broadcast roles","lv":{"1":"Performs parts of a role only with frequent prompting.","2":"Performs most duties in one role but misses some cues or steps.","3":"Reliably performs and rotates through producer, switcher, and other assigned studio roles.","4":"Moves confidently between roles and supports others without disrupting the live broadcast."}},{"label":"Producer coordination","lv":{"1":"Rarely gives or follows production cues at the needed time.","2":"Gives and follows basic cues, but timing or clarity is inconsistent.","3":"Uses clear, timely cues to coordinate roles and keep the broadcast on plan.","4":"Anticipates production needs and adapts cues when the live broadcast changes."}},{"label":"Switcher operation","lv":{"1":"Needs step-by-step help to select or change broadcast sources.","2":"Switches between sources but makes occasional selection or timing errors.","3":"Uses the switching application to select the intended sources at the planned times.","4":"Makes purposeful live switching choices that improve flow when conditions change."}},{"label":"Live studio teamwork","lv":{"1":"Actions frequently interrupt or delay the studio team.","2":"Works with the team but responds inconsistently during live production.","3":"Communicates and responds reliably so the studio team completes a live broadcast.","4":"Helps the team recover smoothly from unexpected problems while maintaining the broadcast."}}],"7.2":[{"label":"Broadcasting equipment","lv":{"1":"Identifies little or no equipment correctly.","2":"Identifies the switcher or encoder but gives an incomplete description of its role.","3":"Correctly identifies the switcher and encoder and explains each role in the broadcast.","4":"Correctly selects and explains the equipment needed for a new broadcast setup."}},{"label":"Signal path","lv":{"1":"Places equipment in an incorrect order and cannot trace the signal.","2":"Builds part of the studio-to-audience path but misses or misplaces a stage.","3":"Correctly orders and traces the signal path from studio source through switcher and encoder to the audience stream.","4":"Adapts the signal path to a different broadcast situation and explains how each stage affects delivery."}},{"label":"Broadcast signals and range","lv":{"1":"Does not distinguish broadcast signals or their reach.","2":"Identifies more than one broadcast signal but compares their ranges incompletely.","3":"Identifies different broadcast signals and accurately compares the ranges over which they reach an audience.","4":"Chooses a suitable signal for a new audience or distance and justifies the choice using range."}}],"7.3":[{"label":"Purpose and audience","lv":{"1":"The broadcast has no clear purpose or identifiable audience.","2":"The purpose and audience are identified, but some content does not suit them.","3":"Content, tone, and format consistently support a specific purpose for a real audience.","4":"Production choices are adapted strategically to strengthen the broadcast’s effect on the audience."}},{"label":"Rundown and planning","lv":{"1":"The rundown is missing or lists disconnected segments without timing or cues.","2":"The rundown sequences the main segments but has incomplete timings, transitions, or production cues.","3":"The timed rundown clearly sequences segments, transitions, roles, media, and production cues.","4":"The rundown anticipates timing changes or technical issues and includes workable adjustments."}},{"label":"Broadcast production","lv":{"1":"Frequent gaps, unclear audio or visuals, or missed cues prevent the message from being understood.","2":"The broadcast is mostly understandable, but uneven pacing, media use, or cue execution distracts from its purpose.","3":"Presenters, audio, visuals, pacing, and cues work together to deliver a coherent broadcast.","4":"Livestream or recording techniques are used confidently and creatively to increase audience engagement."}},{"label":"Rehearsal and refinement","lv":{"1":"The broadcast shows little evidence of rehearsal or correction.","2":"Some issues are corrected, but noticeable timing, delivery, or technical problems remain.","3":"Rehearsal and review lead to clear improvements in timing, delivery, and technical quality.","4":"Audience or production feedback is used to make precise changes that increase the broadcast’s impact."}}],"8.1":[{"label":"Shot sequence","lv":{"1":"Shows a few disconnected shots, so the planned action is difficult to follow.","2":"Orders most shots logically, but some actions or transitions are missing or unclear.","3":"Sequences shots clearly so the animation's action and message can be followed from beginning to end.","4":"Refines the shot sequence to create deliberate pacing, emphasis, or audience impact."}},{"label":"Framing","lv":{"1":"Uses framing inconsistently or leaves the viewer's focus unclear.","2":"Chooses some useful framing, but several shots do not clearly support the intended focus.","3":"Chooses clear framing for each shot to direct attention to important actions or information.","4":"Varies framing purposefully to strengthen meaning, mood, or emphasis across the sequence."}},{"label":"Timing","lv":{"1":"Provides little or no timing information for shots or actions.","2":"Includes timing for some shots or actions, but the planned pace remains partly unclear.","3":"Indicates shot and action timing clearly enough to guide the animation's pace.","4":"Adjusts timing deliberately to build rhythm, anticipation, emphasis, or a stronger message."}},{"label":"Storyboard communication","lv":{"1":"Uses incomplete images or notes that do not communicate the animation plan.","2":"Uses images and notes to communicate the main idea, but important production details are unclear.","3":"Uses clear images and concise notes to map shots, timing, actions, and the intended message.","4":"Adds purposeful detail that helps another creator interpret and produce the animation consistently."}}],"8.2":[{"label":"Keyframes and sequence","lv":{"1":"Keyframes are missing or out of order, so the intended movement is unclear.","2":"Keyframes show a basic start and end, but parts of the movement are confusing or abrupt.","3":"Keyframes are ordered and positioned so the complete movement reads clearly.","4":"Keyframes communicate complex or combined movement clearly in a new animation context."}},{"label":"Frame rate","lv":{"1":"The frame rate makes the animation too fast, too slow, or difficult to follow.","2":"The frame rate allows the action to be seen, but speed or smoothness is inconsistent.","3":"The selected frame rate supports a clear, appropriately paced animation.","4":"The frame rate is deliberately varied or selected to create a specific visual effect while preserving clarity."}},{"label":"Timing and frame spacing","lv":{"1":"Frames are spaced without clear control, causing jumps or unintended pauses.","2":"Some timing choices support the action, but movement contains distracting jumps or pauses.","3":"Frame spacing and duration create controlled timing that makes the action easy to follow.","4":"Timing is deliberately adjusted to emphasize weight, mood, impact, or another intended effect."}},{"label":"Easing","lv":{"1":"Movement starts and stops at one constant speed, appearing mechanical or abrupt.","2":"Acceleration or slowing is attempted, but the change in speed is uneven or unclear.","3":"Frame spacing creates clear easing into and out of movement.","4":"Different easing patterns are applied purposefully to communicate distinct types of motion."}}],"8.3":[{"label":"Purpose and message","lv":{"1":"The animation has no clear purpose, audience, or message.","2":"A purpose or message is present, but the intended audience may not understand it without explanation.","3":"The finished animation communicates a clear message suited to its intended audience and purpose.","4":"The animation uses purposeful creative choices to make the message especially memorable or persuasive for its audience."}},{"label":"Animation choices","lv":{"1":"Movement is missing, incomplete, or unrelated to the message.","2":"Some Grease Pencil or After Effects motion supports the message, but timing or visual continuity is inconsistent.","3":"Controlled motion, timing, and visual choices made with Grease Pencil or After Effects support the message throughout.","4":"Sophisticated motion and timing choices strengthen meaning, guide attention, or create an intentional emotional effect."}},{"label":"Production pipeline","lv":{"1":"Work is incomplete or cannot be followed from planning through production.","2":"The animation passes through some pipeline stages, but files or revisions are disorganized or missing.","3":"The project follows a workable pipeline from planning through asset creation, animation, editing, rendering, and export.","4":"The pipeline is organized and adaptable, with efficient revisions or movement between tools while preserving quality."}},{"label":"Render and export","lv":{"1":"No playable final animation is exported.","2":"An export plays, but has noticeable problems with framing, timing, image quality, sound, or format.","3":"The final render/export plays correctly, presents the complete animation, and is suitable for the intended audience.","4":"Multiple purposeful export choices are produced or optimized for different viewing contexts without weakening the message."}}]},"IBDS":{"ds-u01-001":[{"label":"Interpret the concept","lv":{"1":"States one vague meaning of digital society.","2":"Describes more than one meaning but does not explain why they differ.","3":"Explains and compares at least two defensible interpretations.","4":"Compares interpretations and judges how their assumptions shape a conclusion."}},{"label":"Connect systems, people, and communities","lv":{"1":"Names a digital technology without explaining its social connection.","2":"Describes an effect on a person or group with limited system detail.","3":"Explains how a specific digital system creates different impacts for people or communities.","4":"Transfers the explanation to a less familiar system and qualifies the comparison."}},{"label":"Use evidence","lv":{"1":"Makes an unsupported claim or gives an unrelated example.","2":"Uses a relevant example but does not clearly connect it to the claim.","3":"Uses a relevant cited example and explains how it supports the claim.","4":"Uses and weighs more than one source or perspective to refine the claim."}}],"ds-u02-00   // ── Class-roster import ──
  const REAL={};

  const RLS="tos_rosters_v1";
  const RPAL=["#3b55e6","#0f9d76","#cf8412","#6d5ae0","#c3486b","#2f9d5a","#d9822b","#1aa1b8","#b5581f","#5a51d6"];
  function loadRosters(){

    Object.entries(saved).forEach(([cid,list])=>{ if(COURSES[cid]&&Array.isArray(list)&&list.length){ STUDENTS[cid]=list; REAL[cid]=new Set(list.map(s=>s.id)); } });

  function escH(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
  function parseCSV(text){
    const rows=[];let i=0,f="",row=[],q=false; text=String(text).replace(/\r\n/g,"\n").replace(/\r/g,"\n");
    while(i<text.length){const ch=text[i];
      if(q){ if(ch==='"'){ if(text[i+1]==='"'){f+='"';i+=2;continue;} q=false;i++;continue;} f+=ch;i++;continue; }
      if(ch==='"'){q=true;i++;continue;}
      if(ch===","){row.push(f);f="";i++;continue;}
      if(ch==="\n"){row.push(f);rows.push(row);row=[];f="";i++;continue;}
      f+=ch;i++;
    }
    if(f.length||row.length){row.push(f);rows.push(row);}
    return rows.filter(r=>r.some(c=>String(c).trim()!==""));
  }
  // Accepts pasted text: tab-separated (Excel), comma CSV, or the PowerSchool report ("<ID>  Last, First [Course]")
  function parsePasted(text){
    text=String(text).replace(/\r\n/g,"\n").replace(/\r/g,"\n").trim();
    const lines=text.split("\n").filter(l=>l.trim()); if(!lines.length)return [];
    if(lines[0].includes("\t")) return lines.map(l=>l.split("\t").map(c=>c.trim())).filter(r=>r.some(c=>c!==""));
    // PowerSchool report: "<student id><spaces>Last, First" (name may contain commas) — check before CSV
    const idlines=lines.filter(l=>/^\s*\d{6,}\s+\S/.test(l));
    if(idlines.length>=Math.max(1,Math.ceil(lines.length*0.6))){
      const rows=[["Student ID","Name"]];
      idlines.forEach(l=>{const m=l.match(/^\s*(\d{6,})\s+(.+)$/); if(m)rows.push([m[1],m[2].trim()]);});
      return rows;
    }
    if(lines[0].includes(",")) return parseCSV(text);
    return lines.map(l=>[l.trim()]);
  }
  const RFIELDS=[
    {key:"studentId",label:"Student ID"},{key:"firstName",label:"First name",name:true},{key:"lastName",label:"Last name",name:true},
    {key:"preferredName",label:"Preferred name"},{key:"grade",label:"Grade level"},{key:"section",label:"Class / section"},{key:"email",label:"Email"},
  ];
  let rz=null;
  function guessMap(headers){
    const H=headers.map(h=>String(h).toLowerCase().trim()); const g={};
    const find=(...ks)=>{for(let i=0;i<H.length;i++){if(ks.some(k=>H[i].includes(k)))return i;}return -1;};
    g.studentId=find("student id","studentid","student number","sis","pupil"); if(g.studentId<0)g.studentId=find("id");
    g.firstName=find("first","given","fname"); g.lastName=find("last","surname","family","lname");
    g.preferredName=find("preferred","nickname","goes by"); g.grade=find("grade","level"); g.section=find("section","homeroom","block","class"); g.email=find("email","e-mail");
    if(g.firstName<0&&g.lastName<0){const n=find("name");if(n>=0)g.firstName=n;}
    RFIELDS.forEach(f=>{if(g[f.key]===undefined)g[f.key]=-1;}); return g;
  }
  function openRosterImport(cid){ rz={cid,stage:"upload",headers:null,data:[],map:{},fileName:"",result:null}; renderRoster(); const m=$("#rosterModal"); m.classList.add("open"); m.setAttribute("aria-hidden","false"); }
  function closeRoster(){ const m=$("#rosterModal"); m.classList.remove("open"); m.setAttribute("aria-hidden","true"); rz=null; }
  function handleFile(file){ rz.fileName=file.name; const r=new FileReader();
    r.onload=()=>{ const rows=parseCSV(r.result); if(rows.length<2){toast("That file has no data rows.");return;} rz.headers=rows[0]; rz.data=rows.slice(1); rz.map=guessMap(rz.headers); rz.stage="map"; renderRoster(); };
    r.onerror=()=>toast("Could not read that file."); r.readAsText(file);
  }
  function computeRoster(){
    const cid=rz.cid, defGrade=(STUDENTS[cid][0]&&STUDENTS[cid][0].grade)||12;
    const get=(row,key)=>{const idx=rz.map[key]; return (idx>=0&&idx<row.length)?String(row[idx]).trim():"";};
    const accepted=[],rejected=[],seen=new Set(); let dup=0,ci=0;
    rz.data.forEach((row,i)=>{
      let first=get(row,"firstName"),last=get(row,"lastName");const pref=get(row,"preferredName");
      if(!last && first.includes(", ")){const parts=first.split(", ");last=parts[0].trim();first=parts.slice(1).join(", ").trim();} // "Last, First" in one column
      const name=(pref||[first,last].filter(Boolean).join(" ")).trim();
      if(!name){rejected.push({row:i+2,reason:"no name"});return;}
      const sid0=get(row,"studentId");
      if(!/^[A-Za-z0-9][A-Za-z0-9_.:-]{0,149}$/.test(sid0)){rejected.push({row:i+2,reason:"stable student ID required (letters, digits, dash, underscore, dot or colon)"});return;}
      const legacyID="s"+sid0.replace(/[^A-Za-z0-9]/g,"");
      const stableID=REAL[cid]?.has(sid0)?sid0:REAL[cid]?.has(legacyID)?legacyID:sid0;
      const dk=(sid0||name).toLowerCase();
      if(seen.has(dk)){dup++;return;} seen.add(dk);
      const g=get(row,"grade").replace(/[^0-9]/g,"");
      accepted.push({id:stableID, name, grade:g?parseInt(g,10):defGrade, color:RPAL[ci%RPAL.length], email:get(row,"email")||undefined, section:get(row,"section")||undefined}); ci++;
    });
    const idc={}; accepted.forEach(s=>{ if(idc[s.id]!==undefined){s.id=s.id+"-"+(++idc[s.id]);} else idc[s.id]=0; });
    rz.result={accepted,rejected,dup}; return rz.result;
  }
  function applyRoster(){
    const cid=rz.cid, accepted=rz.result.accepted;if(!accepted.length){toast('Nothing to import.');return;}
    const candidate=JSON.parse(JSON.stringify(store)),priorIDs=REAL[cid]||new Set();candidate[cid]=candidate[cid]||{};
    accepted.forEach(s=>{if(!priorIDs.has(s.id)||!candidate[cid][s.id])candidate[cid][s.id]=emptyState(cid);});
    const rosters=Object.fromEntries(Object.keys(REAL).map(c=>[c,STUDENTS[c]]));rosters[cid]=accepted;
    const r=window.AppStorage.commit({[LS]:JSON.stringify(candidate),[RLS]:JSON.stringify(rosters)});
    if(!r.ok){toast('Roster not imported: '+r.error);showRecovery();return;}
    store=candidate;STUDENTS[cid]=accepted;REAL[cid]=new Set(accepted.map(s=>s.id));window.EvidenceStudio.resetView();student=accepted[0].id;closeRoster();course=cid;setRoute('progress');toast('Imported '+accepted.length+' students into '+COURSES[cid].name);
  }

        <button class="btn ghost" id="rzPasteBtn" style="margin-top:8px">Use pasted text →</button>

  // ── PowerTeacher Pro CSV exports (per-assignment scores + master planning sheet) ──
  const csvq=v=>`"${window.StudioCore.csv([[v]]).slice(2,-1)}"`;

  const fnsafe=s=>String(s).replace(/[^A-Za-z0-9.\- ]+/g,"-").replace(/\s+/g,"-").slice(0,70);

  const TS_LS="tos_termstart_v1"; let termStart={}; try{termStart=JSON.parse(window.AppStorage.getItem(TS_LS)||"{}")||{};}catch(e){}

  function sprintEndWeek(sp){const ns=(String(sp&&sp.weeks||"").match(/\d+/g)||[]).map(Number);return ns.length?Math.max.apply(null,ns):((sp&&sp.n)||1);}

  function sprintSpan(sp){const ns=(String(sp&&sp.weeks||"").match(/\d+/g)||[]).map(Number);return ns.length?[Math.min.apply(null,ns),Math.max.apply(null,ns)]:[(sp&&sp.n)||1,(sp&&sp.n)||1];}
